<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
    <link rel="icon" href="file:///C:/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0d14;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        .board {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* Split background: blue left, black center, red right */
            background: linear-gradient(
                to right,
                #1a6fa8 0%,
                #0a0d14 42%,
                #0a0d14 58%,
                #cc0000 100%
            );
        }

        /* ── TOP ROW ── */
        .top-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            padding: 1vh 2.5vw 0;
            font-size: 2.8vh;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .top-row .ring-label { text-align: left; }
        .top-row .category-label { text-align: center; font-weight: 400; }
        .top-row .match-label { text-align: right; }

        /* ── NAME ROW ── */
        .name-row {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1.5vw;
            padding: 0.8vh 2.5vw 0;
        }
        .flag {
            width: 5.5vh;
            height: 5.5vh;
            border-radius: 50%;
            overflow: hidden;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4vh;
            border: 3px solid rgba(255,255,255,0.3);
            flex-shrink: 0;
        }
        .name-blue {
            font-size: 3.6vh;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .name-red {
            font-size: 3.6vh;
            font-weight: 900;
            letter-spacing: 1px;
            text-align: right;
        }

        /* ── CENTRAL PANEL: 3x3 grid, shared rows guarantee alignment ── */
        .central-panel {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            grid-template-rows: auto auto auto;
            align-items: center;
            justify-items: center;
            padding: 1vh 2.5vw;
            gap: 1vh 2vw;
        }

        .blue-w, .blue-p { justify-self: start; }
        .red-w,  .red-p  { justify-self: end; }

        .stat-block {
            display: flex;
            align-items: baseline;
            gap: 0.8vw;
        }
        .stat-label {
            font-size: 5vh;
            font-weight: 900;
        }
        .stat-value {
            font-size: 5vh;
            font-weight: 900;
        }

        .main-score {
            font-size: 36vh;
            font-weight: 900;
            line-height: 1;
            transition: text-shadow 0.4s ease-out;
        }
        .main-score.blue-text { color: #2aa8e0; }
        .main-score.red-text { color: #ff4444; }

        .main-score.leading {
            text-shadow: 0 0 0.4em currentColor, 0 0 0.8em currentColor;
        }

        @keyframes scoreBump {
            0%   { transform: scale(1);    filter: brightness(1); }
            30%  { transform: scale(1.3); filter: brightness(1.8); }
            100% { transform: scale(1);    filter: brightness(1); }
        }
        .main-score.bump {
            display: inline-block;
            transform-origin: center center;
            animation: scoreBump 0.5s ease-out !important;
        }

        .round-indicator {
            font-size: 6vh;
            font-weight: 900;
            color: white;
            letter-spacing: 1px;
            width: 46vh;
            text-align: center;
        }

        .timer-ring-wrap {
            position: relative;
            width: 46vh;
            height: 46vh;
            display: grid;
            place-items: center;
        }
        .timer-ring-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .timer-ring-track {
            fill: none;
            stroke: #1a2030;
            stroke-width: 6;
        }
        .timer-ring-progress {
            fill: none;
            stroke: #38e07a;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 301.6;
            transition: stroke 0.3s;
        }
        .timer-ring-progress.warning { stroke: #e05a5a; }
        .timer-ring-progress.idle { stroke: #4a5578; }

        .timer-display {
            position: relative;
            grid-area: 1 / 1;
            text-align: center;
            font-size: 9vh;
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: white;
            transition: font-size 0.2s ease-out;
        }
        .timer-display.compact {
            font-size: 16vh;
        }
        .timer-ms {
            font-size: 0.35em;
            font-weight: 700;
            opacity: 0.75;
            margin-left: 0.1em;
        }

        /* ── REFEREE ROW ── */
        .referee-section {
            padding: 0.8vh 2.5vw 0;
        }
        .referee-labels {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            text-align: center;
        }
        .referee-labels span {
            font-size: 1.2vh;
            font-weight: 700;
            letter-spacing: 1px;
            color: #c8ccd8;
        }
        .referee-boxes {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 0.8vw;
            margin-top: 0.4vh;
        }
        .referee-box {
            background: #2a3142;
            border: 1px solid #3a4560;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2vh;
            font-weight: 900;
            color: white;
            height: 5vh;
        }

        /* ── NEXT MATCH ROWS ── */
        .next-matches {
            padding: 0.8vh 2.5vw 1.2vh;
            display: flex;
            flex-direction: column;
            gap: 0.6vh;
        }
        .next-match-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1vw;
        }
        .next-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6vh 1vw;
            border-radius: 4px;
            font-size: 1.3vh;
            font-weight: 700;
        }
        .next-bar.blue {
            background: linear-gradient(to right, #1a6fa8, #2a9ad8);
        }
        .next-bar.red {
            background: linear-gradient(to right, #ff5a5a, #cc0000);
            flex-direction: row-reverse;
        }
        .next-bar .icon { font-size: 1.1em; opacity: 0.8; }
        .next-label {
            text-align: center;
            font-size: 1.2vh;
            font-weight: 700;
            color: #c8ccd8;
            letter-spacing: 0.5px;
        }

        .hidden { display: none !important; }

        .connecting {
            position: fixed;
            inset: 0;
            background: #0a0d14;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #8a93a8;
            z-index: 50;
        }
    </style>
</head>
<body>

<div class="connecting" id="connecting">displayBridge not available — check preload script.</div>

<div class="board">

    <!-- TOP ROW -->
    <div class="top-row">
        <div class="ring-label">RING <span id="ringNumber">1</span></div>
        <div class="category-label" id="categoryLabel">Category</div>
        <div class="match-label">Match <span id="matchNumber">1</span></div>
    </div>

    <!-- NAME ROW -->
    <div class="name-row">
        <div class="flag" id="flagBlue">🏳️</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="name-blue" id="nameBlue">BLUE</div>
            <div class="name-red" id="nameRed">RED</div>
        </div>
        <div class="flag" id="flagRed">🏳️</div>
    </div>

    <!-- CENTRAL PANEL: blue stats | timer ring | red stats -->
    <div class="central-panel">
        <div class="stat-block blue-w">
            <span class="stat-label">W</span>
            <span class="stat-value" id="wBlue">0</span>
        </div>
        <div class="round-indicator" id="roundIndicatorRow">R <span id="roundIndicator">1</span>/<span id="roundTotal">1</span></div>
        <div class="stat-block red-w">
            <span class="stat-value" id="wRed">0</span>
            <span class="stat-label">W</span>
        </div>

        <div class="main-score blue-text blue-score" id="mainScoreBlue">0</div>
        <div class="timer-ring-wrap">
            <svg class="timer-ring-svg" viewBox="0 0 120 120">
                <circle class="timer-ring-track" cx="60" cy="60" r="48"></circle>
                <circle class="timer-ring-progress" id="timerRingProgress" cx="60" cy="60" r="48"></circle>
            </svg>
            <div class="timer-display" id="timerDisplay">02:00<span class="timer-ms" id="timerMs"></span></div>
        </div>
        <div class="main-score red-text red-score" id="mainScoreRed">0</div>

        <div class="stat-block blue-p">
            <span class="stat-label">-P</span>
            <span class="stat-value" id="pBlue">0</span>
        </div>
        <div></div>
        <div class="stat-block red-p">
            <span class="stat-value" id="pRed">0</span>
            <span class="stat-label">-P</span>
        </div>
    </div>

    <!-- REFEREES -->
    <div class="referee-section">
        <div class="referee-labels">
            <span>REF. 1</span>
            <span>REF. 2</span>
            <span>REF. 3</span>
            <span>REF. 4</span>
        </div>
        <div class="referee-boxes" id="refereeBoxes">
            <div class="referee-box" id="ref1blue">0</div>
            <div class="referee-box" id="ref1red">0</div>
            <div class="referee-box" id="ref2blue">0</div>
            <div class="referee-box" id="ref2red">0</div>
            <div class="referee-box" id="ref3blue">0</div>
            <div class="referee-box" id="ref3red">0</div>
            <div class="referee-box" id="ref4blue">0</div>
            <div class="referee-box" id="ref4red">0</div>
        </div>
    </div>

    <!-- NEXT MATCHES -->
    <div class="next-matches">
        <div class="next-match-row">
            <div class="next-bar blue"><span class="icon">👤</span><span id="next1Blue">BLUE</span></div>
            <div class="next-label">NEXT MATCH #1</div>
            <div class="next-bar red"><span id="next1Red">RED</span><span class="icon">👤</span></div>
        </div>
        <div class="next-match-row">
            <div class="next-bar blue"><span class="icon">👤</span><span id="next2Blue">BLUE</span></div>
            <div class="next-label">NEXT MATCH #2</div>
            <div class="next-bar red"><span id="next2Red">RED</span><span class="icon">👤</span></div>
        </div>
    </div>

</div>

<script>
    // Country code -> flag emoji (basic ISO mapping, extend as needed)
    function flagEmoji(countryName) {
        const map = {
            ITALY: "🇮🇹", FRANCE: "🇫🇷", SPAIN: "🇪🇸", GERMANY: "🇩🇪",
            "UNITED KINGDOM": "🇬🇧", USA: "🇺🇸", "UNITED STATES": "🇺🇸"
        };
        return map[(countryName || "").toUpperCase()] || "🏳️";
    }

    function formatTime(seconds) {
        if (seconds < 60) {
            return String(seconds);
        }
        const m = Math.floor(seconds / 60).toString().padStart(2, "0");
        const s = (seconds % 60).toString().padStart(2, "0");
        return `${m}:${s}`;
    }

    // ── SIMULATED SMOOTH COUNTDOWN ──
    // admin.html only ticks once per second. To show a smooth countdown with
    // centiseconds during the last 10 seconds, we locally interpolate between
    // server updates using requestAnimationFrame, re-syncing on every update.
    let countdownFrame = null;
    let countdownTargetSeconds = 0;
    let countdownTotalSeconds = 120;
    let countdownIsRunning = false;
    let countdownAnchorTime = 0;   // performance.now() when this update arrived
    let countdownAnchorValue = 0;  // remainingSeconds value at that moment

    function startSimulatedCountdown(remainingSeconds, totalSeconds, isRunning) {
        countdownTargetSeconds = remainingSeconds;
        countdownTotalSeconds = totalSeconds;
        countdownIsRunning = isRunning;
        countdownAnchorTime = performance.now();
        countdownAnchorValue = remainingSeconds;

        if (countdownFrame) cancelAnimationFrame(countdownFrame);
        countdownTick();
    }

    function countdownTick() {
        let displaySeconds = countdownAnchorValue;

        if (countdownIsRunning) {
            const elapsed = (performance.now() - countdownAnchorTime) / 1000;
            displaySeconds = Math.max(0, countdownAnchorValue - elapsed);
        }

        renderCountdown(displaySeconds);

        if (countdownIsRunning && displaySeconds > 0) {
            countdownFrame = requestAnimationFrame(countdownTick);
        }
    }

    function renderCountdown(displaySeconds) {
        const timerEl = document.getElementById("timerDisplay");
        const msEl = document.getElementById("timerMs");
        const wholeSeconds = Math.ceil(displaySeconds);

        timerEl.classList.toggle("compact", wholeSeconds < 60);

        if (displaySeconds < 10) {
            // Show whole seconds (no leading zero) + centiseconds, e.g. "9" + ".87"
            const whole = Math.floor(displaySeconds);
            const centis = Math.floor((displaySeconds - whole) * 100);
            timerEl.textContent = String(whole);
            timerEl.appendChild(msEl);
            msEl.textContent = "." + String(centis).padStart(2, "0");
        } else {
            msEl.textContent = "";
            timerEl.textContent = formatTime(wholeSeconds);
            timerEl.appendChild(msEl);
        }

        updateTimerRing(displaySeconds, countdownTotalSeconds, countdownIsRunning);
    }

    const RING_CIRCUMFERENCE = 301.6; // 2 * PI * 48, matches stroke-dasharray in CSS

    function updateTimerRing(remaining, total, isRunning) {
        const ring = document.getElementById("timerRingProgress");
        ring.style.strokeDasharray = RING_CIRCUMFERENCE;

        const safeTotal = (typeof total === "number" && total > 0) ? total : (parseInt(total) || 120);
        const fraction = Math.max(0, Math.min(1, remaining / safeTotal));

        ring.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - fraction));

        ring.classList.remove("warning", "idle");
        if (!isRunning) {
            ring.classList.add("idle");
        } else if (remaining <= 10) {
            ring.classList.add("warning");
        }
    }

    // ── MAIN SCORE: bump animation on change + glow on the leading color ──
    let lastScoreRed = null;
    let lastScoreBlue = null;

    function applyMainScore(red, blue) {
        const redEl = document.getElementById("mainScoreRed");
        const blueEl = document.getElementById("mainScoreBlue");

        if (lastScoreRed !== null && red !== lastScoreRed) {
            console.log("[display] RED score changed", lastScoreRed, "->", red, "- bumping");
            bumpScore(redEl);
        }
        if (lastScoreBlue !== null && blue !== lastScoreBlue) {
            console.log("[display] BLUE score changed", lastScoreBlue, "->", blue, "- bumping");
            bumpScore(blueEl);
        }

        redEl.textContent = red;
        blueEl.textContent = blue;

        redEl.classList.toggle("leading", red > blue);
        blueEl.classList.toggle("leading", blue > red);

        lastScoreRed = red;
        lastScoreBlue = blue;
    }

    function bumpScore(el) {
        el.classList.remove("bump");
        void el.offsetWidth;
        el.classList.add("bump");
        setTimeout(() => el.classList.remove("bump"), 500);
    }

    // ── APPLY INCOMING STATE ──
    // payload shape mirrors what admin.html tracks internally; every field is optional.
    function applyState(payload) {
        document.getElementById("connecting").classList.add("hidden");

        if (payload.ring !== undefined) document.getElementById("ringNumber").textContent = payload.ring;
        if (payload.category !== undefined) document.getElementById("categoryLabel").textContent = payload.category;
        if (payload.matchNumber !== undefined) document.getElementById("matchNumber").textContent = payload.matchNumber;

        if (payload.nameRed !== undefined) document.getElementById("nameRed").textContent = payload.nameRed;
        if (payload.nameBlue !== undefined) document.getElementById("nameBlue").textContent = payload.nameBlue;
        if (payload.countryRed !== undefined) document.getElementById("flagRed").textContent = flagEmoji(payload.countryRed);
        if (payload.countryBlue !== undefined) document.getElementById("flagBlue").textContent = flagEmoji(payload.countryBlue);

        if (payload.roundIndicator !== undefined) document.getElementById("roundIndicator").textContent = payload.roundIndicator;
        if (payload.roundTotal !== undefined) document.getElementById("roundTotal").textContent = payload.roundTotal;

        if (payload.remainingSeconds !== undefined) {
            startSimulatedCountdown(payload.remainingSeconds, payload.totalSeconds, payload.isRunning);
        }

        if (payload.warnings) {
            document.getElementById("wRed").textContent = payload.warnings.red ?? 0;
            document.getElementById("wBlue").textContent = payload.warnings.blue ?? 0;
        }
        if (payload.minusPoints) {
            document.getElementById("pRed").textContent = payload.minusPoints.red ?? 0;
            document.getElementById("pBlue").textContent = payload.minusPoints.blue ?? 0;
        }
        if (payload.score) {
            applyMainScore(payload.score.red ?? 0, payload.score.blue ?? 0);
        }

        if (payload.referees) {
            payload.referees.forEach((ref, idx) => {
                const i = idx + 1;
                const redBox = document.getElementById(`ref${i}red`);
                const blueBox = document.getElementById(`ref${i}blue`);
                if (redBox) redBox.textContent = ref?.score?.red ?? 0;
                if (blueBox) blueBox.textContent = ref?.score?.blue ?? 0;
            });
        }

        if (payload.nextMatches) {
            payload.nextMatches.forEach((m, idx) => {
                const i = idx + 1;
                const redEl = document.getElementById(`next${i}Red`);
                const blueEl = document.getElementById(`next${i}Blue`);
                if (redEl && m) redEl.textContent = m.red || "RED";
                if (blueEl && m) blueEl.textContent = m.blue || "BLUE";
            });
        }
    }

    // ── IPC LISTENER ──
    if (window.displayBridge) {
        window.displayBridge.onUpdate(applyState);
    } else {
        document.getElementById("connecting").textContent = "displayBridge not available — check preload script.";
    }
</script>



</body></html>
