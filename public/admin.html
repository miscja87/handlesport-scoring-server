        <div class="error-modal-body" id="errorModalMessage">
            Something went wrong.
        </div>
        <div class="error-modal-footer">
            <button onclick="closeErrorModal()">OK</button>
        </div>
    </div>
</div>

<!-- REFEREE AUTH MODAL -->
<div class="auth-modal-overlay hidden" id="authModalOverlay" onclick="closeAuthModalOnBackdrop(event)">
    <div class="auth-modal">
        <div class="auth-modal-header">
            <h3 id="authModalTitle">Referee link</h3>
            <button class="auth-modal-close" onclick="closeAuthModal()">✕</button>
        </div>
        <div class="auth-modal-body">
            <div class="auth-qr-box" id="authQrBox"></div>
            <div class="auth-url-row">
                <input type="text" class="auth-url-input" id="authUrlInput" readonly>
                <button class="auth-copy-btn" onclick="copyAuthUrl()">Copy</button>
            </div>
        </div>
    </div>
</div>

<!-- INFO MODAL (round/match transitions) -->
<div class="info-modal-overlay hidden" id="infoModalOverlay" onclick="closeInfoModalOnBackdrop(event)">
    <div class="info-modal">
        <div class="info-modal-header">
            <span class="info-icon">ⓘ</span>
            <h3 id="infoModalTitle">Info</h3>
        </div>
        <div class="info-modal-body" id="infoModalMessage">
            Message
        </div>
        <div class="error-modal-footer hidden" id="infoModalFooter">
            <button id="infoModalBtn" onclick="closeInfoModal()">OK</button>
        </div>
    </div>
</div>

<!-- WINNER MODAL -->
<div class="info-modal-overlay hidden" id="winnerModalOverlay" onclick="closeWinnerModalOnBackdrop(event)">
    <div class="info-modal">
        <div class="info-modal-header">
            <span class="info-icon">🏆</span>
            <h3 id="winnerModalTitle">Match finished</h3>
        </div>
        <div class="info-modal-body" id="winnerModalMessage">
            All rounds have been completed.
        </div>
        <div class="winner-modal-score" id="winnerModalScore"></div>
        <div class="winner-btn-row">
            <button class="winner-btn red" id="winnerBtnRed" onclick="confirmWinner('red')">RED WINS</button>
            <button class="winner-btn blue" id="winnerBtnBlue" onclick="confirmWinner('blue')">BLUE WINS</button>
        </div>
        <div class="winner-cancel-row">
            <button class="winner-cancel-btn" onclick="closeWinnerModal()">Cancel — review scores first</button>
        </div>
    </div>
</div>

<script>
    // ── CONSTANTS ──
    let localIp = null;
    let currentMatches = [];
    let currentMatchIndex = 0;
    
    // ── TIMER STATE ──
    let totalSeconds = parseInt(document.getElementById("roundDuration").value);
    let remainingSeconds = totalSeconds;
    let timerInterval = null;
    let isRunning = false;
    let isBreakPhase = false;

    // ── DOCTOR TIMER STATE ──
    // Cumulative remaining seconds per color, persists across pause/resume within a match.
    let doctorTimerInterval = null;
    let activeDoctorColor = null; // "red" | "blue" | null
    let savedRoundIndicator = "1";
    let savedRoundTotal = "1";

    // Disables the round START/PAUSE/RESUME button while a doctor timer is
    // running, since the two timers can never run at the same time.
    function syncRoundButtonWithDoctorTimer() {
        startStopBtn.disabled = !!activeDoctorColor;
        startStopBtn.title = activeDoctorColor
            ? `Stop the doctor timer ${activeDoctorColor.toUpperCase()} first`
            : "";
    }
    const doctorTimerState = {
        red:  { remaining: parseInt(document.getElementById("doctorDuration").value) || 180, running: false },
        blue: { remaining: parseInt(document.getElementById("doctorDuration").value) || 180, running: false }
    };

    const timerDisplay = document.getElementById("timerDisplay");
    const startStopBtn = document.getElementById("startStopBtn");
    const startStopLabel = document.getElementById("startStopLabel");
    const startStopIcon = document.getElementById("startStopIcon");
    const stateDot = document.getElementById("stateDot");
    const stateText = document.getElementById("stateText");

    // ── SOUNDS ──
    const gongSound = document.getElementById('gong_sound');
    
    // ── ACTIONS ──
    const ACTION_CONNECTED = "connected";
    const ACTION_UPDATE_SCORE = "update_score";

    // ── SETUP PARAMS (from intro.html) ──
    const setupParams = new URLSearchParams(window.location.search);
    const setupEventId = setupParams.get("event");
    const setupRingId = setupParams.get("ring");
    const setupSpecialty = setupParams.get("specialty");

    // ── INIT ──
    async function init() {
        try {
            if (!setupEventId || !setupRingId || !setupSpecialty) {
                showErrorModal("Missing setup data", "Event, ring or specialty were not provided. Please go back and complete the setup screen.");
                return;
            }

            const res = await fetch(`http://localhost:8080/api/login/admin`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ eventId: setupEventId, ringId: setupRingId, specialty: setupSpecialty })
            });
            if (!res.ok) throw new Error(`Login failed (HTTP ${res.status})`);
            const data = await res.json();

            console.log("Login successful:", data);
            localIp = data.localIp;

            document.getElementById("ringNumber").textContent = setupRingId;

            const eventSource = new EventSource(`http://${localIp}:8080/stream/admin`);
            console.log("Event stream initialized on", `http://${localIp}:8080/stream/admin`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log("Event received:", data);

                if (data.action === ACTION_CONNECTED) {
                    markRefereeConnected(data.referee);
                }

                if (data.action === ACTION_UPDATE_SCORE) {
                    updateRefereeScore(data.referee, data.score);
                }
            };

        } catch (err) {
            
            console.error("Initialization error:", err);
            showErrorModal("Login failed", "Could not connect to the local server. Please check that the server is running and try again.");
        }
    }

    // ── ERROR MODAL ──
    function showErrorModal(title, message) {
        document.getElementById("errorModalTitle").textContent = title;
        document.getElementById("errorModalMessage").textContent = message;
        document.getElementById("errorModalOverlay").classList.remove("hidden");
    }

    function closeErrorModal() {
        document.getElementById("errorModalOverlay").classList.add("hidden");
    }

    function closeErrorModalOnBackdrop(event) {
        if (event.target.id === "errorModalOverlay") closeErrorModal();
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, "0");
        const s = (seconds % 60).toString().padStart(2, "0");
        return `${m}:${s}`;
    }

    function renderTimer() {
        timerDisplay.textContent = formatTime(remainingSeconds);
        timerDisplay.classList.remove("running", "warning");
        if (isRunning) {
            timerDisplay.classList.add(remainingSeconds <= 10 ? "warning" : "running");
        }
        pushDisplayUpdate();
    }

    function setState(running) {
        isRunning = running;
        if (running) {
            stateDot.classList.add("play");
            stateText.classList.remove("stop");
            stateText.classList.add("play");
            stateText.textContent = "PLAY";
            timerDisplay.classList.add(remainingSeconds <= 10 ? "warning" : "running");
        } else {
            stateDot.classList.remove("play");
            stateText.classList.remove("play");
            stateText.classList.add("stop");
            stateText.textContent = "STOP";
            startStopLabel.textContent = "START";
            startStopIcon.textContent = "▶";
            timerDisplay.classList.remove("running", "warning");
        }
        renderTimer();
    }

    // Updates only the START/PAUSE/RESUME label without touching server state
    function setButtonLabel(label, icon) {
        startStopLabel.textContent = label;
        startStopIcon.textContent = icon;
    }

    // ── DOCTOR TIMER ──
    const doctorTimerLeftBtn = document.getElementById("doctorTimerLeftBtn");
    const doctorTimerRightBtn = document.getElementById("doctorTimerRightBtn");
    const roundLabelEl = document.querySelector(".round-label");

    function doctorButtonLabel(color, state) {
        // state: "start" | "pause" | "resume"
        const colorLabel = color.toUpperCase();
        if (state === "pause") return `PAUSE DOCTOR TIMER ${colorLabel}`;
        if (state === "resume") return `RESUME DOCTOR TIMER ${colorLabel}`;
        return `START DOCTOR TIMER ${colorLabel}`;
    }

    function setDoctorButtonText(color, label) {
        const btn = color === "red" ? doctorTimerLeftBtn : doctorTimerRightBtn;
        const icon = btn.querySelector(".icon");
        btn.innerHTML = "";
        if (icon) btn.appendChild(icon);
        btn.append(" " + label);
    }

    function toggleDoctorTimer(color) {
        const ds = doctorTimerState[color];

        if (ds.running) {
            pauseDoctorTimer(color);
            return;
        }

        // Can only start a doctor timer while the round timer itself is not running.
        if (isRunning) {
            showToast("Pause the round timer before starting the doctor timer");
            return;
        }

        // Only one doctor timer (red or blue) can run at a time.
        if (activeDoctorColor && activeDoctorColor !== color) {
            showToast(`Doctor timer ${activeDoctorColor.toUpperCase()} is already running`);
            return;
        }

        startOrResumeDoctorTimer(color);
    }

    function startOrResumeDoctorTimer(color) {
        const ds = doctorTimerState[color];

        ds.running = true;
        ds.everStarted = true;
        activeDoctorColor = color;
        syncRoundButtonWithDoctorTimer();

        setDoctorButtonText(color, doctorButtonLabel(color, "pause"));
        renderDoctorOverlay(color);
        pushDisplayUpdate();

        doctorTimerInterval = setInterval(() => doctorTick(color), 1000);
    }

    function pauseDoctorTimer(color) {
        clearInterval(doctorTimerInterval);
        doctorTimerInterval = null;

        const ds = doctorTimerState[color];
        ds.running = false;
        activeDoctorColor = null;
        syncRoundButtonWithDoctorTimer();

        setDoctorButtonText(color, doctorButtonLabel(color, "resume"));
        restoreRoundDisplay();
        pushDisplayUpdate();
    }

    function doctorTick(color) {
        const ds = doctorTimerState[color];

        if (ds.remaining <= 0) {
            clearInterval(doctorTimerInterval);
            doctorTimerInterval = null;
            ds.running = false;
            activeDoctorColor = null;
            syncRoundButtonWithDoctorTimer();
            setDoctorButtonText(color, doctorButtonLabel(color, "start"));
            ds.remaining = 0;
            restoreRoundDisplay();
            pushDisplayUpdate();
            showToast(`Doctor timer ${color.toUpperCase()} finished`);
            return;
        }

        ds.remaining -= 1;
        renderDoctorOverlay(color);
        pushDisplayUpdate();
    }

    function renderDoctorOverlay(color) {
        const ds = doctorTimerState[color];
        timerDisplay.textContent = formatTime(ds.remaining);
        timerDisplay.classList.remove("running", "warning");
        timerDisplay.classList.add(ds.remaining <= 10 ? "warning" : "running");

        // Save round values before destroying the elements via innerHTML below
        // (only needed once, but harmless to do on every tick since the
        // elements no longer exist after the first overwrite anyway).
        const indicatorEl = document.getElementById("roundIndicator");
        const totalEl = document.getElementById("roundTotal");
        if (indicatorEl) savedRoundIndicator = indicatorEl.textContent;
        if (totalEl) savedRoundTotal = totalEl.textContent;

        roundLabelEl.innerHTML = `DOCTOR TIMER<br>${color.toUpperCase()}`;
    }

    function restoreRoundDisplay() {
        renderTimer();
        roundLabelEl.innerHTML = `ROUND<br><span id="roundIndicator">${savedRoundIndicator}</span>/<span id="roundTotal">${savedRoundTotal}</span>`;
    }

    // Allows manually adjusting the remaining round time (e.g. adding 10s back)
    // by clicking the timer display. Blocked while the doctor timer overlay is
    // showing, since the display would be showing the wrong value in that case.
    function editRemainingTime() {
        if (activeDoctorColor) {
            showToast("Pause the doctor timer before editing the round time");
            return;
        }

        openKeypad(null, "Remaining time (s)", 0, {
            allowNegative: false,
            initialValue: remainingSeconds,
            onConfirm: (value) => {
                remainingSeconds = Math.max(0, value);
                if (remainingSeconds > totalSeconds) {
                    totalSeconds = remainingSeconds;
                }
                renderTimer();
                showToast(`Remaining time set to ${formatTime(remainingSeconds)}`);
            }
        });
    }

    function resetDoctorTimers() {
        clearInterval(doctorTimerInterval);
        doctorTimerInterval = null;
        activeDoctorColor = null;
        syncRoundButtonWithDoctorTimer();

        const defaultDuration = parseInt(document.getElementById("doctorDuration").value) || 180;
        ["red", "blue"].forEach(color => {
            doctorTimerState[color] = { remaining: defaultDuration, running: false, everStarted: false };
            setDoctorButtonText(color, doctorButtonLabel(color, "start"));
        });

        restoreRoundDisplay();
    }

    doctorTimerLeftBtn.addEventListener("click", () => toggleDoctorTimer("red"));
    doctorTimerRightBtn.addEventListener("click", () => toggleDoctorTimer("blue"));

    async function updateMatchStatus(state) {
        try {
            const base = localIp ? `http://${localIp}:8080` : "http://localhost:8080";
            const res = await fetch(`${base}/api/match/status`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ state })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
        } catch (err) {
            console.error("Match status update error:", err);
        }
    }

    function tick() {
        if (remainingSeconds <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;

            if (isBreakPhase) {
                onBreakFinished();
            } else {
                onRoundFinished();
            }
            return;
        }
        remainingSeconds -= 1;
        renderTimer();
        if (remainingSeconds <= 10) {
            timerDisplay.classList.add("warning");
        }
    }

    function onRoundFinished() {
        setState(false);

        const currentRound = parseInt(document.getElementById("roundIndicator").textContent) || 1;
        const totalRounds = parseInt(document.getElementById("roundTotal").textContent) || 1;

        if (currentRound >= totalRounds) {
            showWinnerModal();
            return;
        }

        showInfoModal(
            `Round ${currentRound} finished`,
            "Click below to start the break before the next round.",
            "START BREAK",
            startBreak
        );
    }

    function startBreak() {
        isBreakPhase = true;
        isRunning = true;
        updateMatchStatus("stop");

        totalSeconds = parseInt(document.getElementById("breakDuration").value) || 60;
        remainingSeconds = totalSeconds;

        stateDot.classList.remove("play");
        stateText.classList.remove("play");
        stateText.classList.add("stop");
        stateText.textContent = "BREAK";

        renderTimer();
        timerInterval = setInterval(tick, 1000);
    }

    function onBreakFinished() {
        isBreakPhase = false;

        const currentRound = parseInt(document.getElementById("roundIndicator").textContent) || 1;
        document.getElementById("roundIndicator").textContent = currentRound + 1;
        savedRoundIndicator = String(currentRound + 1);

        totalSeconds = parseInt(document.getElementById("roundDuration").value) || 120;
        remainingSeconds = totalSeconds;

        setState(false);
        setButtonLabel("START", "▶");
    }

    // ── INFO MODAL (round/match transitions) ──
    function showInfoModal(title, message, buttonText = null, onConfirm = null) {
        document.getElementById("infoModalTitle").textContent = title;
        document.getElementById("infoModalMessage").textContent = message;

        const footer = document.getElementById("infoModalFooter");
        const btn = document.getElementById("infoModalBtn");

        if (buttonText) {
            footer.classList.remove("hidden");
            btn.textContent = buttonText;
            btn.onclick = () => {
                closeInfoModal();
                if (onConfirm) onConfirm();
            };
        } else {
            footer.classList.add("hidden");
        }

        document.getElementById("infoModalOverlay").classList.remove("hidden");
    }

    function closeInfoModal() {
        document.getElementById("infoModalOverlay").classList.add("hidden");
    }

    function closeInfoModalOnBackdrop(event) {
        if (event.target.id === "infoModalOverlay") closeInfoModal();
    }

    // ── WINNER MODAL ──
    function showWinnerModal(matchEndedNaturally = true) {
        const redScore = parseInt(document.getElementById("mainScoreLeft").textContent) || 0;
        const blueScore = parseInt(document.getElementById("mainScoreRight").textContent) || 0;

        const scoreEl = document.getElementById("winnerModalScore");
        const messageEl = document.getElementById("winnerModalMessage");
        const redBtn = document.getElementById("winnerBtnRed");
        const blueBtn = document.getElementById("winnerBtnBlue");

        const intro = matchEndedNaturally
            ? "All rounds have been completed."
            : "Set the winner now (e.g. retirement, injury, disqualification).";

        scoreEl.innerHTML = `<span class="red-text">${redScore}</span> — <span class="blue-text">${blueScore}</span>`;
        redBtn.classList.remove("suggested");
        blueBtn.classList.remove("suggested");

        if (redScore === blueScore) {
            messageEl.textContent = `${intro} The result is currently a tie — please select the winner manually.`;
        } else if (redScore > blueScore) {
            messageEl.textContent = `${intro} RED is currently ahead — confirm the winner below.`;
            redBtn.classList.add("suggested");
        } else {
            messageEl.textContent = `${intro} BLUE is currently ahead — confirm the winner below.`;
            blueBtn.classList.add("suggested");
        }

        document.getElementById("winnerModalOverlay").classList.remove("hidden");
    }

    function confirmWinner(color) {
        closeWinnerModal();
        showToast(`${color.toUpperCase()} confirmed as the winner`);

        if (window.displayBridge) {
            const winnerName = color === "red"
                ? document.getElementById("nameLeft")?.textContent
                : document.getElementById("nameRight")?.textContent;

            const scoreRed = parseInt(document.getElementById("mainScoreLeft")?.textContent) || 0;
            const scoreBlue = parseInt(document.getElementById("mainScoreRight")?.textContent) || 0;

            window.displayBridge.update({
                announceWinner: { color: color, name: winnerName, scoreRed: scoreRed, scoreBlue: scoreBlue }
            });
        }
        // Server notification intentionally not implemented yet — UI-only for now.
    }

    function closeWinnerModal() {
        document.getElementById("winnerModalOverlay").classList.add("hidden");
    }

    function closeWinnerModalOnBackdrop(event) {
        if (event.target.id === "winnerModalOverlay") closeWinnerModal();
    }

    // Starts the timer for the first time in this round — this is the only
    // point (besides RESET ALL) where the server is notified of a state change.
    function startTimer() {
        if (timerInterval) return;

        if (activeDoctorColor) {
            showToast(`Stop the doctor timer ${activeDoctorColor.toUpperCase()} before starting the round`);
            return;
        }

        // If time has already run out (e.g. winner was cancelled to review scores),
        // re-trigger the round-finished flow instead of starting a 0-second countdown.
        if (remainingSeconds <= 0) {
            onRoundFinished();
            return;
        }

        setState(true);
        setButtonLabel("PAUSE", "❙❙");
        gongSound.play();
        timerInterval = setInterval(tick, 1000);
        updateMatchStatus("play");
    }

    // Pauses the countdown locally — does NOT notify the server.
    function pauseTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        isRunning = false;
        stateDot.classList.remove("play");
        timerDisplay.classList.remove("running", "warning");
        setButtonLabel("RESUME", "▶");
        renderTimer();
    }

    // Resumes a paused countdown locally — does NOT notify the server.
    function resumeTimer() {
        if (timerInterval) return;

        if (activeDoctorColor) {
            showToast(`Stop the doctor timer ${activeDoctorColor.toUpperCase()} before resuming the round`);
            return;
        }

        isRunning = true;
        stateDot.classList.add("play");
        timerDisplay.classList.add(remainingSeconds <= 10 ? "warning" : "running");
        setButtonLabel("PAUSE", "❙❙");
        timerInterval = setInterval(tick, 1000);
        renderTimer();
    }

    // RESET ALL is the only other action that notifies the server ("stop").
    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        setState(false);
        updateMatchStatus("stop");
    }

    startStopBtn.addEventListener("click", () => {
        const label = startStopLabel.textContent;
        if (label === "START") {
            startTimer();
        } else if (label === "PAUSE") {
            pauseTimer();
        } else if (label === "RESUME") {
            resumeTimer();
        }
    });

    document.getElementById("resetAllBtn").addEventListener("click", () => {
        stopTimer();
        closeInfoModal();
        resetDoctorTimers();

        isBreakPhase = false;
        document.getElementById("roundIndicator").textContent = "1";
        savedRoundIndicator = "1";
        savedRoundTotal = document.getElementById("roundTotal")?.textContent || "1";

        totalSeconds = parseInt(document.getElementById("roundDuration").value) || 120;
        remainingSeconds = totalSeconds;
        renderTimer();
        setButtonLabel("START", "▶");

        // Reset score displays
        ["wScoreLeft", "wScoreRight", "pScoreLeft", "pScoreRight", "mainScoreLeft", "mainScoreRight"].forEach(id => {
            document.getElementById(id).textContent = "0";
        });

        // Reset every referee's individual score back to zero
        for (let i = 1; i <= refereeCount; i++) {
            if (!refereeState[i]) continue;
            refereeState[i].score = { red: 0, blue: 0 };

            const redBox = document.getElementById(`refScoreRed${i}`);
            const blueBox = document.getElementById(`refScoreBlue${i}`);
            if (redBox) redBox.textContent = "0";
            if (blueBox) blueBox.textContent = "0";

            if (refereeState[i].connected) {
                notifyRefereeScore(i, refereeState[i].score);
            }
        }

        notifyMatchScoreState();
    });

    document.getElementById("roundDuration").addEventListener("change", (e) => {
        if (!isRunning) {
            totalSeconds = parseInt(e.target.value) || 120;
            remainingSeconds = totalSeconds;
            renderTimer();
        }
    });

    // ── KEYPAD ──
    let keypadTargetId = null;
    let keypadMin = 0;
    let keypadValue = "";
    let keypadAllowNegative = false;
    let keypadOnConfirm = null;

    // targetId: id of an <input> to update directly (legacy behavior), or null
    // when using a custom onConfirm callback instead (e.g. referee score boxes).
    function openKeypad(targetId, title, min, options = {}) {
        keypadTargetId = targetId;
        keypadMin = min;
        keypadAllowNegative = options.allowNegative ?? false;
        keypadOnConfirm = options.onConfirm ?? null;

        const startValue = options.initialValue ?? (targetId ? document.getElementById(targetId).value : "");
        keypadValue = startValue !== undefined && startValue !== null ? String(startValue) : "";

        document.getElementById("keypadTitle").textContent = title;
        document.getElementById("keypadDisplay").value = keypadValue || "0";
        document.getElementById("keypadSignBtn").disabled = !keypadAllowNegative;
        document.getElementById("keypadOverlay").classList.remove("hidden");

        const displayInput = document.getElementById("keypadDisplay");
        setTimeout(() => {
            displayInput.focus();
            displayInput.select();
        }, 0);
    }

    function closeKeypad() {
        document.getElementById("keypadOverlay").classList.add("hidden");
        keypadTargetId = null;
        keypadOnConfirm = null;
        keypadAllowNegative = false;
    }

    function closeKeypadOnBackdrop(event) {
        if (event.target.id === "keypadOverlay") closeKeypad();
    }

    // ── CATEGORY MODAL ──
    function openCategoryModal() {
        document.getElementById("categoryModalOverlay").classList.remove("hidden");
        refreshCategoryList();
    }

    function closeCategoryModal() {
        document.getElementById("categoryModalOverlay").classList.add("hidden");
    }

    function closeCategoryModalOnBackdrop(event) {
        if (event.target.id === "categoryModalOverlay") closeCategoryModal();
    }

    // Maps category id -> full category object (needed for pool, etc.)
    const categoriesById = {};

    async function refreshCategoryList() {
        const select = document.getElementById("categorySelect");

        try {
            const base = localIp ? `http://${localIp}:8080` : "http://localhost:8080";
            const res = await fetch(`${base}/api/categories`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const categories = await res.json();

            select.innerHTML = "";
            categories.forEach(cat => {
                categoriesById[cat.id] = cat;

                const option = document.createElement("option");
                option.value = cat.id;
                option.textContent = cat.long_custom_name;
                select.appendChild(option);
            });

            showToast(`Category list refreshed (${categories.length} categories)`);
        } catch (err) {
            console.error("Failed to fetch categories:", err);
            showErrorModal("Could not load categories", "Failed to fetch the category list from the server. Please check the connection and try again.");
        }
    }

    async function loadCategory() {
        const select = document.getElementById("categorySelect");
        if (!select.options.length) {
            showToast("No category selected");
            return;
        }
        const selectedOption = select.options[select.selectedIndex];
        const categoryId = selectedOption.value;
        const category = categoriesById[categoryId];

        document.getElementById("categoryDisplay").textContent = selectedOption.textContent;
        document.getElementById("categoryDisplay").dataset.categoryId = categoryId;
        closeCategoryModal();

        if (!category || !category.pool) {
            showToast("Category loaded (pool info missing — could not load matches)");
            return;
        }

        await loadMatches(categoryId, category.pool);
    }

    // Fetches matches for the loaded category/pool and populates RED/BLUE names
    // for the current match (left_player_des / right_player_des).
    async function loadMatches(idCategory, pool) {
        try {
            const base = localIp ? `http://${localIp}:8080` : "http://localhost:8080";
            const res = await fetch(`${base}/api/matches?id_category=${idCategory}&pool=${pool}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            const matches = data.matches || [];
            if (!matches.length) {
                showToast("Category loaded — no matches found");
                return;
            }

            matches.sort((a, b) => parseInt(b.id_match) - parseInt(a.id_match));

            currentMatches = matches;
            currentMatchIndex = 0;
            applyMatch(currentMatches[currentMatchIndex]);

            showToast(`Category loaded (${matches.length} matches)`);
        } catch (err) {
            console.error("Failed to fetch matches:", err);
            showErrorModal("Could not load matches", "Failed to fetch the match list for this category. Please check the connection and try again.");
        }
    }

    // Applies a single match's player names to the RED/BLUE name bars.
    function applyMatch(match) {
        if (!match) return;
        document.getElementById("nameLeft").textContent = match.left_player_des || "RED";
        document.getElementById("nameRight").textContent = match.right_player_des || "BLUE";
        document.getElementById("matchNumber").value = match.id_match;
        setFlag("flagLeft", match.left_player_country_name);
        setFlag("flagRight", match.right_player_country_name);
        updateMatchStatusBadge(match.state);
        updateMatchNavButtons();
        updateNextMatchPreview();
        notifyMatchDetails(match);
        pushDisplayUpdate();
    }

    // Sets a flag <img> src from a country name (e.g. "ITALY" -> /images/flags/ITALY.png).
    // Falls back to hiding the image if the country is missing or the file doesn't exist.
    let currentCountryRed = "";
    let currentCountryBlue = "";

    function setFlag(imgId, countryName) {
        const img = document.getElementById(imgId);
        if (!img) return;

        if (imgId === "flagLeft") currentCountryRed = countryName || "";
        if (imgId === "flagRight") currentCountryBlue = countryName || "";

        if (!countryName) {
            img.style.visibility = "hidden";
            return;
        }

        img.style.visibility = "visible";
        img.src = `/images/flags/${countryName.toUpperCase()}.png`;
        img.onerror = () => { img.style.visibility = "hidden"; };
    }

    // currentMatches is sorted by id_match descending, and goToNextMatch moves
    // to currentMatchIndex + 1 — so the "next" match in flow is that same index.
    function updateNextMatchPreview() {
        const next = currentMatches[currentMatchIndex + 1];
        const redEl = document.getElementById("nextMatchRed");
        const blueEl = document.getElementById("nextMatchBlue");

        if (next) {
            redEl.textContent = next.left_player_des || "RED";
            blueEl.textContent = next.right_player_des || "BLUE";
        } else {
            redEl.textContent = "—";
            blueEl.textContent = "—";
        }
    }

    function updateMatchStatusBadge(state) {
        const badge = document.getElementById("matchStatusBadge");
        const labels = { IDLE: "Idle", IN_PROGRESS: "In progress", COMPLETED: "Completed" };

        badge.classList.remove("idle", "in_progress", "completed", "visible");

        if (!state || !labels[state]) {
            return;
        }

        badge.textContent = labels[state];
        badge.classList.add(state.toLowerCase(), "visible");
    }

    // Notifies the server of the current match details (player names, countries,
    // photos, category and specialty) so it can be persisted to Firestore.
    async function notifyMatchDetails(match) {
        try {
            const base = localIp ? `http://${localIp}:8080` : "http://localhost:8080";
            const categoryName = document.getElementById("categoryDisplay").textContent;

            const body = {
                "red.name": match.left_player_des || "RED",
                "blue.name": match.right_player_des || "BLUE",
                "red.country": match.left_player_country_name || "",
                "blue.country": match.right_player_country_name || "",
                "red.photo": match.left_player_photo || "default.png",
                "blue.photo": match.right_player_photo || "default.png",
                "category": categoryName,
                "specialty": setupSpecialty
            };

            const res = await fetch(`${base}/api/match/details`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);

        } catch (err) {
            console.error("Failed to notify match details:", err);
        }
    }

    // ── DISPLAY WINDOW (second monitor) ──
    let displayWindowOpen = false;

    function toggleDisplayWindow() {
        if (!window.displayBridge) {
            showToast("Display bridge not available");
            return;
        }

        const btn = document.getElementById("displayToggleBtn");

        if (displayWindowOpen) {
            window.displayBridge.closeDisplay();
            displayWindowOpen = false;
            btn.textContent = "📺 OPEN DISPLAY";
            btn.classList.remove("active");
        } else {
            window.displayBridge.openDisplay();
            displayWindowOpen = true;
            btn.textContent = "📺 DISPLAY ON";
            btn.classList.add("active");
            setTimeout(pushDisplayUpdate, 400); // give the new window time to attach its listener
        }
    }

    // Collects the full current state and sends it to the public display
    // window via Electron IPC (window.displayBridge, exposed by preload-admin.cjs).
    function pushDisplayUpdate() {
        if (!window.displayBridge) return;

        let referees = [];
        try {
            for (let i = 1; i <= refereeCount; i++) {
                const ref = refereeState[i];
                referees.push(
                    ref && ref.connected && ref.enabled
                        ? { score: ref.score, active: true }
                        : { score: { red: 0, blue: 0 }, active: false }
                );
            }
        } catch (err) {
            // refereeState/refereeCount not initialized yet (e.g. very first renderTimer() call) — skip referees this time.
            return;
        }

        window.displayBridge.update({
            ring: document.getElementById("ringNumber")?.textContent,
            category: document.getElementById("categoryDisplay")?.textContent,
            matchNumber: document.getElementById("matchNumber")?.value,

            nameRed: document.getElementById("nameLeft")?.textContent,
            nameBlue: document.getElementById("nameRight")?.textContent,
            countryRed: currentCountryRed,
            countryBlue: currentCountryBlue,

            roundIndicator: document.getElementById("roundIndicator")?.textContent ?? savedRoundIndicator,
            roundTotal: document.getElementById("roundTotal")?.textContent ?? savedRoundTotal,
            isBreakPhase: isBreakPhase,
            activeDoctorColor: activeDoctorColor,
            doctorTimerRemaining: activeDoctorColor ? doctorTimerState[activeDoctorColor]?.remaining : null,
            doctorTimerTotal: parseInt(document.getElementById("doctorDuration")?.value) || 180,

            remainingSeconds: remainingSeconds,
            totalSeconds: totalSeconds,
            isRunning: isRunning,

            score: {
                red: parseInt(document.getElementById("mainScoreLeft")?.textContent) || 0,
                blue: parseInt(document.getElementById("mainScoreRight")?.textContent) || 0
            },
            warnings: {
                red: parseInt(document.getElementById("wScoreLeft")?.textContent) || 0,
                blue: parseInt(document.getElementById("wScoreRight")?.textContent) || 0
            },
            minusPoints: {
                red: parseInt(document.getElementById("pScoreLeft")?.textContent) || 0,
                blue: parseInt(document.getElementById("pScoreRight")?.textContent) || 0
            },

            referees: referees,

            nextMatches: [{
                red: document.getElementById("nextMatchRed")?.textContent || "",
                blue: document.getElementById("nextMatchBlue")?.textContent || ""
            }]
        });
    }

    // Notifies the server of the current score/warnings/minusPoints state
    // (the main top boxes), independent of the per-referee data.
    async function notifyMatchScoreState() {
        pushDisplayUpdate();
        try {
            const base = localIp ? `http://${localIp}:8080` : "http://localhost:8080";

            const body = {
                score: {
                    red: parseInt(document.getElementById("mainScoreLeft").textContent) || 0,
                    blue: parseInt(document.getElementById("mainScoreRight").textContent) || 0
                },
                warnings: {
                    red: parseInt(document.getElementById("wScoreLeft").textContent) || 0,
                    blue: parseInt(document.getElementById("wScoreRight").textContent) || 0
                },
                minusPoints: {
                    red: parseInt(document.getElementById("pScoreLeft").textContent) || 0,
                    blue: parseInt(document.getElementById("pScoreRight").textContent) || 0
                }
            };

            const res = await fetch(`${base}/api/match/details`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);

        } catch (err) {
            console.error("Failed to notify match score state:", err);
        }
    }

    // Array is sorted by id_match descending (4, 3, 2, 1).
    // PREV (+1 on id_match) moves to the previous array index.
    // NEXT (-1 on id_match) moves to the next array index.
    function goToPrevMatch() {
        if (currentMatchIndex <= 0) return;
        currentMatchIndex -= 1;
        applyMatch(currentMatches[currentMatchIndex]);
    }

    function goToNextMatch() {
        if (currentMatchIndex >= currentMatches.length - 1) return;
        currentMatchIndex += 1;
        applyMatch(currentMatches[currentMatchIndex]);
    }

    function updateMatchNavButtons() {
        document.getElementById("prevMatchBtn").disabled = currentMatchIndex <= 0;
        document.getElementById("nextMatchBtn").disabled = currentMatchIndex >= currentMatches.length - 1;
    }

    document.getElementById("prevMatchBtn").addEventListener("click", goToPrevMatch);
    document.getElementById("nextMatchBtn").addEventListener("click", goToNextMatch);

    function keypadPress(digit) {
        if (keypadValue.length >= 6) return; // reasonable max length
        keypadValue += digit;
        document.getElementById("keypadDisplay").value = keypadValue;
    }

    function keypadBackspace() {
        keypadValue = keypadValue.slice(0, -1);
        document.getElementById("keypadDisplay").value = keypadValue || "0";
    }

    function keypadClear() {
        keypadValue = "";
        document.getElementById("keypadDisplay").value = "0";
    }

    function keypadToggleSign() {
        if (!keypadAllowNegative) return;
        if (keypadValue.startsWith("-")) {
            keypadValue = keypadValue.slice(1);
        } else if (keypadValue) {
            keypadValue = "-" + keypadValue;
        } else {
            keypadValue = "-";
        }
        document.getElementById("keypadDisplay").value = keypadValue || "0";
    }

    // Syncs keypadValue when the user types directly on a physical keyboard.
    function keypadOnInput(input) {
        let raw = input.value;

        // Keep only digits, and a leading minus sign if negatives are allowed
        let sign = "";
        if (keypadAllowNegative && raw.startsWith("-")) {
            sign = "-";
            raw = raw.slice(1);
        }
        const digits = raw.replace(/[^0-9]/g, "").slice(0, 6);

        keypadValue = sign + digits;
        input.value = keypadValue;
    }

    function keypadOnKeydown(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            confirmKeypad();
        } else if (event.key === "Escape") {
            event.preventDefault();
            closeKeypad();
        }
    }

    function confirmKeypad() {
        if (!keypadTargetId && !keypadOnConfirm) return;

        let value = parseInt(keypadValue);
        if (isNaN(value)) value = keypadMin;
        if (!keypadAllowNegative && value < keypadMin) value = keypadMin;

        if (keypadOnConfirm) {
            keypadOnConfirm(value);
        } else {
            const input = document.getElementById(keypadTargetId);
            input.value = value;
            input.dispatchEvent(new Event("change"));
        }

        closeKeypad();
    }

    // Sync ROUND total display with ROUND NUMBER field
    document.getElementById("roundCount").addEventListener("change", (e) => {
        document.getElementById("roundTotal").textContent = e.target.value;
        savedRoundTotal = e.target.value;
    });

    // ── WARNING / PENALTY LOGIC ──
    // Every 3 warnings (W) for a color, 1 point is automatically removed (P+1, shown as -P).
    function bindWarningCounter(plusId, minusId, wDisplayId, color) {
        const wDisplay = document.getElementById(wDisplayId);

        document.getElementById(plusId).addEventListener("click", () => {
            const newW = parseInt(wDisplay.textContent) + 1;
            wDisplay.textContent = newW;

            if (newW % 3 === 0) {
                subtractPointFromAllReferees(color); // already notifies score state internally
                showToast(`3 warnings reached — 1 point removed from all referees (${color})`);
            } else {
                notifyMatchScoreState();
            }
        });

        document.getElementById(minusId).addEventListener("click", () => {
            wDisplay.textContent = Math.max(0, parseInt(wDisplay.textContent) - 1);
            notifyMatchScoreState();
        });
    }

    // Subtracts 1 point from the given color for every referee, updates their
    // card display, then recalculates the main majority-vote score.
    function subtractPointFromAllReferees(color) {
        for (let i = 1; i <= refereeCount; i++) {
            const ref = refereeState[i];
            if (!ref || !ref.connected || !ref.enabled) continue;

            ref.score[color] = (parseFloat(ref.score[color]) || 0) - 1;

            const box = document.getElementById(`refScore${color === "red" ? "Red" : "Blue"}${i}`);
            if (box) box.textContent = ref.score[color];

            notifyRefereeScore(i, ref.score);
        }
        recalculateMainScore();
    }

    // Opens the keypad to manually edit a single referee's score for one color.
    function editRefereeScore(refereeId, color) {
        const ref = refereeState[refereeId];
        if (!ref) return;

        openKeypad(null, `Referee ${refereeId} — ${color.toUpperCase()} score`, 0, {
            allowNegative: true,
            initialValue: ref.score[color],
            onConfirm: (value) => {
                ref.score[color] = value;

                const box = document.getElementById(`refScore${color === "red" ? "Red" : "Blue"}${refereeId}`);
                if (box) box.textContent = value;

                recalculateMainScore();

                if (ref.connected) {
                    notifyRefereeScore(refereeId, ref.score);
                }

                showToast(`Referee ${refereeId} ${color} score set to ${value}`);
            }
        });
    }

    // Resets a single referee's score back to zero (local UI + main score + server notify).
    // Enables or disables a referee. A disabled referee is excluded from the
    // main majority-vote score and from warning/penalty point subtractions,
    // as if it didn't exist — but its own score/connection state is preserved.
    function toggleRefereeEnabled(refereeId, enabled) {
        const ref = refereeState[refereeId];
        if (!ref) return;

        ref.enabled = enabled;

        const card = document.getElementById(`refEnabled${refereeId}`).closest(".referee-card");
        if (card) card.classList.toggle("disabled-referee", !enabled);

        recalculateMainScore();
        showToast(`Referee ${refereeId} ${enabled ? "enabled" : "disabled"}`);
    }

    function resetRefereeScore(refereeId) {
        const ref = refereeState[refereeId];
        if (!ref) return;

        ref.score = { red: 0, blue: 0 };

        const redBox = document.getElementById(`refScoreRed${refereeId}`);
        const blueBox = document.getElementById(`refScoreBlue${refereeId}`);
        if (redBox) redBox.textContent = "0";
        if (blueBox) blueBox.textContent = "0";

        recalculateMainScore();

        if (ref.connected) {
            notifyRefereeScore(refereeId, ref.score);
        }

        showToast(`Referee ${refereeId} score reset`);
    }

    // Notifies the server (and therefore the referee's tablet) of a score
    // change that originated from the admin panel (warnings, penalties, reset).
    async function notifyRefereeScore(refereeId, score) {
        try {
            const base = localIp ? `http://${localIp}:8080` : "http://localhost:8080";
            const res = await fetch(`${base}/api/score/referee/${refereeId}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    action: "reset_score",
                    score: { red: score.red, blue: score.blue }
                })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
        } catch (err) {
            console.error(`Failed to notify referee ${refereeId} of score update:`, err);
        }
    }

    function bindPenaltyMinus(minusId, pDisplayId) {
        document.getElementById(minusId).addEventListener("click", () => {
            const pDisplay = document.getElementById(pDisplayId);
            pDisplay.textContent = Math.max(0, parseInt(pDisplay.textContent) - 1);
            notifyMatchScoreState();
        });
    }

    function bindPenaltyPlus(plusId, pDisplayId, color) {
        document.getElementById(plusId).addEventListener("click", () => {
            const pDisplay = document.getElementById(pDisplayId);
            pDisplay.textContent = parseInt(pDisplay.textContent) + 1;

            subtractPointFromAllReferees(color);
            showToast(`Penalty given — 1 point removed from all referees (${color})`);
        });
    }

    bindWarningCounter("wPlusLeft",  "wMinusLeft",  "wScoreLeft",  "red");
    bindWarningCounter("wPlusRight", "wMinusRight", "wScoreRight", "blue");
    bindPenaltyMinus("pMinusLeft",  "pScoreLeft");
    bindPenaltyMinus("pMinusRight", "pScoreRight");
    bindPenaltyPlus("pPlusLeft",  "pScoreLeft",  "red");
    bindPenaltyPlus("pPlusRight", "pScoreRight", "blue");

    renderTimer();

    // ── REFEREES ──
    const refereeCount = 4;
    const refereesGrid = document.getElementById("refereesGrid");

    // Placeholder state per referee; real values come from /api/login/admin + /api/tablet/url later
    const refereeState = {};
    for (let i = 1; i <= refereeCount; i++) {
        refereeState[i] = { score: { red: 0, blue: 0 }, code: null, url: null, connected: false, enabled: true };
    }

    function renderReferees() {
        refereesGrid.innerHTML = "";
        for (let i = 1; i <= refereeCount; i++) {
            const card = document.createElement("div");
            card.className = "referee-card";
            card.innerHTML = `
                <div class="referee-title-row">
                    <div class="referee-title">Referee ${i}</div>
                    <label class="referee-toggle">
                        <input type="checkbox" id="refEnabled${i}" ${refereeState[i].enabled ? "checked" : ""}>
                        <span class="referee-toggle-slider"></span>
                    </label>
                </div>
                <div class="referee-score-row">
                    <div class="referee-score-box red" id="refScoreRed${i}" onclick="editRefereeScore(${i}, 'red')">0</div>
                    <div class="referee-score-box blue" id="refScoreBlue${i}" onclick="editRefereeScore(${i}, 'blue')">0</div>
                </div>
                <div class="referee-btn-row">
                    <button class="referee-btn auth" id="refAuth${i}">AUTH</button>
                    <button class="referee-btn reset" id="refReset${i}">RESET</button>
                </div>
                <div class="referee-btn-row">
                    <button class="referee-btn copy" id="refCode${i}" ${refereeState[i].code ? "" : "disabled"}>
                        <span class="copy-icon">⧉</span> ${refereeState[i].code ?? "CODE"}
                    </button>
                    <button class="referee-btn copy" id="refUrl${i}" ${refereeState[i].url ? "" : "disabled"}>
                        <span class="copy-icon">⧉</span> URL
                    </button>
                </div>
            `;
            refereesGrid.appendChild(card);

            // ENABLE/DISABLE toggle — excludes this referee from the majority vote when off
            document.getElementById(`refEnabled${i}`).addEventListener("change", (e) => {
                toggleRefereeEnabled(i, e.target.checked);
            });

            // AUTH — calls /api/tablet/url/:id, shows QR + copyable link
            document.getElementById(`refAuth${i}`).addEventListener("click", () => {
                authReferee(i);
            });

            // RESET — resets this referee's score to zero and notifies the server
            document.getElementById(`refReset${i}`).addEventListener("click", () => {
                resetRefereeScore(i);
            });

            // CODE — copy to clipboard
            document.getElementById(`refCode${i}`).addEventListener("click", () => {
                if (!refereeState[i].code) return;
                copyToClipboard(refereeState[i].code, `Code for Referee ${i} copied`);
            });

            // URL — copy to clipboard
            document.getElementById(`refUrl${i}`).addEventListener("click", () => {
                if (!refereeState[i].url) return;
                copyToClipboard(refereeState[i].url, `URL for Referee ${i} copied`);
            });
        }
    }

    function copyToClipboard(text, message) {
        navigator.clipboard.writeText(text)
            .then(() => showToast(message))
            .catch(() => showToast("Copy failed"));
    }

    // ── REFEREE AUTH ──
    let currentAuthRefereeId = null;

    async function authReferee(refereeId) {
        try {
            const base = localIp ? `http://${localIp}:8080` : "http://localhost:8080";
            const res = await fetch(`${base}/api/tablet/url/${refereeId}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            if (!data.ok || !data.url) throw new Error("Invalid response");

            refereeState[refereeId].url = data.url;

            // Enable the URL copy button on the card now that we have a value
            const urlBtn = document.getElementById(`refUrl${refereeId}`);
            if (urlBtn) {
                urlBtn.disabled = false;
                urlBtn.innerHTML = `<span class="copy-icon">⧉</span> URL`;
            }

            openAuthModal(refereeId, data.url);

        } catch (err) {
            console.error("Referee auth error:", err);
            showErrorModal("Authentication failed", `Could not generate the link for Referee ${refereeId}. Please check the server connection and try again.`);
        }
    }

    function openAuthModal(refereeId, url) {
        currentAuthRefereeId = refereeId;
        document.getElementById("authModalTitle").textContent = `Referee ${refereeId} link`;
        document.getElementById("authUrlInput").value = url;

        const qrBox = document.getElementById("authQrBox");
        qrBox.innerHTML = "";
        const canvas = document.createElement("canvas");
        qrBox.appendChild(canvas);
        QRCode.toCanvas(canvas, url, { width: 220, margin: 1 }, (err) => {
            if (err) console.error("QR generation error:", err);
        });

        document.getElementById("authModalOverlay").classList.remove("hidden");
    }

    function closeAuthModal() {
        document.getElementById("authModalOverlay").classList.add("hidden");
        currentAuthRefereeId = null;
    }

    function closeAuthModalOnBackdrop(event) {
        if (event.target.id === "authModalOverlay") closeAuthModal();
    }

    function copyAuthUrl() {
        const url = document.getElementById("authUrlInput").value;
        copyToClipboard(url, "Link copied to clipboard");
    }

    // ── REFEREE CONNECTED ──
    function markRefereeConnected(refereeId) {
        if (!refereeState[refereeId]) return;
        refereeState[refereeId].connected = true;

        const redBox = document.getElementById(`refScoreRed${refereeId}`);
        const blueBox = document.getElementById(`refScoreBlue${refereeId}`);
        if (redBox) redBox.classList.add("connected");
        if (blueBox) blueBox.classList.add("connected");

        // Close the AUTH modal if it's currently open for this referee
        if (currentAuthRefereeId === refereeId) {
            closeAuthModal();
        }

        showToast(`Referee ${refereeId} connected`);
    }

    // ── REFEREE SCORE UPDATE ──
    function updateRefereeScore(refereeId, score) {
        if (!refereeState[refereeId] || !score) return;

        refereeState[refereeId].score = score;

        const redBox = document.getElementById(`refScoreRed${refereeId}`);
        const blueBox = document.getElementById(`refScoreBlue${refereeId}`);
        if (redBox) redBox.textContent = score.red ?? 0;
        if (blueBox) blueBox.textContent = score.blue ?? 0;

        recalculateMainScore();
    }

    // Main score = how many referees currently favor red vs blue (majority voting).
    // A referee favors the color with the higher score; ties count for neither.
    function recalculateMainScore() {
        let redVotes = 0;
        let blueVotes = 0;

        for (let i = 1; i <= refereeCount; i++) {
            const ref = refereeState[i];
            if (!ref || !ref.connected || !ref.enabled || !ref.score) continue;

            const red = parseFloat(ref.score.red) || 0;
            const blue = parseFloat(ref.score.blue) || 0;

            if (red > blue) redVotes++;
            else if (blue > red) blueVotes++;
        }

        document.getElementById("mainScoreLeft").textContent = redVotes;
        document.getElementById("mainScoreRight").textContent = blueVotes;

        notifyMatchScoreState();
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2200);
    }

    renderReferees();

    window.addEventListener("load", init);
</script>

</body>
</html>
