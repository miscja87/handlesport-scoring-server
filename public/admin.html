<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <link rel="icon" href="/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1f2e;
            font-family: 'Arial', sans-serif;
            color: #e8eaf0;
            min-height: 100vh;
            padding: 20px 24px;
        }

        .panel {
            width: 100%;
            margin: 0;
        }

        /* ── TOP BAR ── */
        .topbar {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 32px;
        }

        .topbar-row2 {
            display: grid;
            grid-template-columns: 70px 110px 1fr 110px 110px 110px 110px 1fr 110px 70px;
            gap: 14px;
            align-items: flex-end;
        }

        .topbar .ring-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .topbar .ring-title .event-name {
            color: #a0aab8;
            font-weight: 400;
        }

        /* ── CATEGORY BAR ── */
        .category-bar {
            display: grid;
            grid-template-columns: 70px 110px 1fr 110px;
            gap: 14px;
            grid-column: 1 / 5;
        }
        .category-display {
            grid-column: 1 / 4;
            background: #252d3f;
            border: 1px solid #3a4560;
            color: #e8eaf0;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .load-btn {
            grid-column: 4;
            background: #1a6fa8;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 14px;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .load-btn:active { filter: brightness(1.2); }

        /* ── CATEGORY MODAL ── */
        .category-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .category-modal {
            background: #1f2638;
            border-radius: 10px;
            width: 460px;
            max-width: 90vw;
            overflow: hidden;
        }
        .category-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid #2a3550;
        }
        .category-modal-header h3 {
            color: #4a9fd8;
            font-size: 18px;
            font-weight: 700;
        }
        .category-modal-close {
            background: none;
            border: none;
            color: #8a93a8;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }
        .category-modal-close:active { color: white; }
        .category-modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .category-select {
            background: #252d3f;
            border: 1px solid #3a4560;
            color: #e8eaf0;
            padding: 12px 14px;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
            outline: none;
        }
        .category-modal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            padding: 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        .category-modal-btn:active { filter: brightness(1.2); }
        .category-modal-btn.refresh { background: #1a6fa8; }
        .category-modal-btn.load { background: #2a9a5a; }

        /* ── ERROR MODAL ── */
        .error-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-modal {
            background: #1f2638;
            border-radius: 10px;
            width: 380px;
            max-width: 90vw;
            overflow: hidden;
            border: 1px solid #5a2a30;
        }
        .error-modal-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 20px;
            border-bottom: 1px solid #2a3550;
        }
        .error-modal-header .error-icon {
            color: #e05a5a;
            font-size: 20px;
        }
        .error-modal-header h3 {
            color: #e05a5a;
            font-size: 16px;
            font-weight: 700;
        }
        .error-modal-body {
            padding: 20px;
            color: #c8ccd8;
            font-size: 14px;
            line-height: 1.5;
        }
        .error-modal-footer {
            padding: 0 20px 20px;
        }
        .error-modal-footer button {
            width: 100%;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            background: #cc3340;
        }
        .error-modal-footer button:active { filter: brightness(1.2); }

        /* ── INFO MODAL (round/match transitions) ── */
        .info-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .info-modal {
            background: #1f2638;
            border-radius: 10px;
            width: 380px;
            max-width: 90vw;
            overflow: hidden;
            border: 1px solid #2a5a7a;
        }
        .info-modal-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 20px;
            border-bottom: 1px solid #2a3550;
        }
        .info-modal-header .info-icon {
            color: #4a9fd8;
            font-size: 20px;
        }
        .info-modal-header h3 {
            color: #4a9fd8;
            font-size: 16px;
            font-weight: 700;
        }
        .info-modal-body {
            padding: 20px;
            color: #c8ccd8;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ── REFEREE AUTH MODAL ── */
        .auth-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 250;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-modal {
            background: #1f2638;
            border-radius: 10px;
            width: 360px;
            max-width: 90vw;
            overflow: hidden;
        }
        .auth-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid #2a3550;
        }
        .auth-modal-header h3 {
            color: #4a9fd8;
            font-size: 16px;
            font-weight: 700;
        }
        .auth-modal-close {
            background: none;
            border: none;
            color: #8a93a8;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }
        .auth-modal-close:active { color: white; }
        .auth-modal-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .auth-qr-box {
            background: white;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-qr-box canvas { display: block; }
        .auth-url-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .auth-url-input {
            flex: 1;
            background: #252d3f;
            border: 1px solid #3a4560;
            color: #e8eaf0;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
            min-width: 0;
        }
        .auth-copy-btn {
            background: #1a6fa8;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 13px;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .auth-copy-btn:active { filter: brightness(1.2); }

        .topbar-fields {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            align-items: flex-end;
            grid-column: 5 / 11;
            justify-content: flex-end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field label {
            font-size: 11px;
            color: #a0aab8;
            letter-spacing: 0.5px;
        }
        .field input {
            background: #252d3f;
            border: 1px solid #3a4560;
            color: #e8eaf0;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 14px;
            width: 80px;
            outline: none;
            cursor: pointer;
        }
        .field input:focus { border-color: #1a6fa8; }
        .field input:active { background: #2a3550; }

        /* ── KEYPAD MODAL ── */
        .keypad-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .keypad-modal {
            background: #1f2638;
            border-radius: 14px;
            padding: 20px;
            width: 280px;
        }
        .keypad-title {
            color: #a0aab8;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            text-align: center;
        }
        .keypad-display {
            background: #252d3f;
            border: 1px solid #3a4560;
            border-radius: 8px;
            color: white;
            font-size: 28px;
            font-weight: 900;
            text-align: center;
            padding: 14px;
            margin-bottom: 14px;
            font-variant-numeric: tabular-nums;
            min-height: 28px;
            width: 100%;
            outline: none;
            font-family: inherit;
        }
        .keypad-display:focus { border-color: #1a6fa8; }
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .keypad-key {
            background: #2a3550;
            border: none;
            color: white;
            font-size: 20px;
            font-weight: 700;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .keypad-key:active { filter: brightness(1.3); }
        .keypad-key.wide { grid-column: span 1; }
        .keypad-key:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .keypad-key:disabled:active { filter: none; }
        .keypad-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .keypad-actions button {
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            color: white;
        }
        .keypad-cancel { background: #3a4560; color: #a0aab8; }
        .keypad-confirm { background: #1a6fa8; }
        .keypad-actions button:active { filter: brightness(1.2); }

        .hidden { display: none !important; }

        .match-nav {
            display: flex;
            align-items: flex-end;
            gap: 6px;
        }
        .match-nav .field input { width: 60px; text-align: center; }

        .nav-btn {
            background: #2a3550;
            border: none;
            color: #6a7590;
            padding: 9px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        .nav-btn:not(:disabled) { color: white; cursor: pointer; }
        .nav-btn:not(:disabled):active { filter: brightness(1.3); }
        .nav-btn:disabled { cursor: not-allowed; }

        /* ── SCORE ROW ── */
        .score-row {
            display: grid;
            grid-template-columns: 70px 110px 1fr 110px 110px 110px 110px 1fr 110px 70px;
            gap: 14px;
            align-items: stretch;
            margin-bottom: 28px;
        }

        .country-select {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 70px;
        }
        .country-select select {
            background: #252d3f;
            border: 1px solid #3a4560;
            color: #e8eaf0;
            padding: 8px 4px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            width: 100%;
            outline: none;
        }
        .flag { font-size: 22px; line-height: 1; }

        .name-bar {
            display: flex;
            align-items: center;
            padding: 0 18px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 1px;
            color: white;
        }
        .name-bar.red  { background: #cc0000; }
        .name-bar.blue { background: #1a6fa8; }

        .timer-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e0b400;
            border-radius: 6px;
            font-size: 32px;
            font-weight: 900;
            color: #1a1f2e;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }
        .timer-bar.running { background: #38a169; color: white; }
        .timer-bar.warning { background: #cc0000; color: white; }

        /* ── MAIN SCORE ── */
        .main-score-row {
            display: grid;
            grid-template-columns: 70px 110px 1fr 110px 110px 110px 110px 1fr 110px 70px;
            gap: 14px;
            align-items: center;
            margin-bottom: 14px;
        }
        .main-score {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100px;
            border-radius: 8px;
            font-size: 64px;
            font-weight: 900;
            color: white;
            grid-column: 1 / 5;
        }
        .main-score.red  { background: #cc0000; }
        .main-score.blue { background: #1a6fa8; grid-column: 7 / 11; }
        .round-label {
            text-align: center;
            color: #a0aab8;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            white-space: nowrap;
            grid-column: 5 / 7;
        }

        /* ── SCORE GRID ── */
        .score-grid-row {
            display: grid;
            grid-template-columns: 70px 110px 1fr 110px 110px 110px 110px 1fr 110px 70px;
            gap: 14px;
            margin-bottom: 14px;
        }

        .side-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            color: #6a7590;
            width: 28px;
        }
        .side-label.red-text  { color: #e05a5a; }
        .side-label.blue-text { color: #4a9fd8; }

        .adj-btn {
            border: none;
            color: white;
            font-weight: 900;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: filter 0.1s;
            min-height: 48px;
        }
        .adj-btn:active { filter: brightness(1.25); }
        .adj-btn.red  { background: #cc0000; }
        .adj-btn.blue { background: #1a6fa8; }

        .score-display {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 900;
            border-radius: 6px;
            color: white;
            min-height: 48px;
        }
        .score-display.red  { background: #cc0000; }
        .score-display.blue { background: #1a6fa8; }
        .score-display.center-display {
            background: #252d3f;
            color: #e8eaf0;
            font-size: 22px;
        }

        .action-row {
            display: grid;
            grid-template-columns: 70px 110px 1fr 110px 110px 110px 110px 1fr 110px 70px;
            gap: 14px;
            margin-bottom: 28px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: filter 0.1s;
        }
        .action-btn:active { filter: brightness(1.2); }
        .action-btn.red  { background: #cc0000; }
        .action-btn.blue { background: #1a6fa8; }
        .action-btn.green { background: #2a7a2a; }
        .action-btn .icon { font-size: 15px; }

        /* ── STATE INDICATOR ── */
        .state-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .state-dot {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            background: #e53e3e;
        }
        .state-dot.play { background: #38a169; }
        .state-text.stop { color: #e53e3e; }
        .state-text.play { color: #38a169; }

        @media (max-width: 900px) {
            .score-grid-row {
                grid-template-columns: repeat(2, 1fr);
                grid-template-areas:
                    "labelL labelR"
                    "adjL adjR"
                    "scoreL scoreR"
                    "adjL2 adjR2"
                    "score2L score2R";
            }
        }

        /* ── REFEREES SECTION ── */
        .referees-section {
            margin-top: 36px;
            padding-top: 28px;
            border-top: 1px solid #2a3550;
        }
        .referees-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }
        .referee-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .referee-title {
            text-align: center;
            color: #8a93a8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .referee-score-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .referee-score-box {
            background: #252d3f;
            border: 1px solid #3a4560;
            color: #5a6580;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .referee-score-box:active { filter: brightness(1.3); }
        .referee-score-box.connected.red {
            background: #cc0000;
            color: white;
            border-color: #cc0000;
        }
        .referee-score-box.connected.blue {
            background: #1a6fa8;
            color: white;
            border-color: #1a6fa8;
        }
        .referee-btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .referee-btn {
            border: none;
            color: white;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: filter 0.1s;
        }
        .referee-btn:active { filter: brightness(1.25); }
        .referee-btn.auth  { background: #1a6fa8; }
        .referee-btn.reset { background: #4a5578; }
        .referee-btn.copy {
            background: transparent;
            border: 1px solid #3a4560;
            color: #4a9a5a;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .referee-btn.copy:disabled {
            color: #5a6580;
            cursor: not-allowed;
            border-color: #2a3550;
        }
        .referee-btn.copy:not(:disabled):active { filter: brightness(1.3); }
        .referee-btn.copy .copy-icon { font-size: 12px; }

        @media (max-width: 900px) {
            .referees-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 22px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 99;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="panel">

    <audio id="gong_sound"><source src="gong.mp3"></audio>

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="ring-title">RING <span id="ringNumber">1</span> - <span class="event-name" id="eventName">Test Event</span></div>

        <div class="topbar-row2">
            <!-- CATEGORY BAR -->
            <div class="category-bar">
                <div class="category-display" id="categoryDisplay">No category loaded</div>
                <button class="load-btn" onclick="openCategoryModal()">Load</button>
            </div>

            <div class="topbar-fields">
                <div class="field">
                    <label>ROUND NUMBER</label>
                    <input type="text" id="roundCount" value="1" readonly onclick="openKeypad('roundCount', 'Round number', 1)">
                </div>
                <div class="field">
                    <label>ROUND DURATION (s)</label>
                    <input type="text" id="roundDuration" value="120" readonly onclick="openKeypad('roundDuration', 'Round duration (s)', 1)">
                </div>
                <div class="field">
                    <label>BREAK (s)</label>
                    <input type="text" id="breakDuration" value="60" readonly onclick="openKeypad('breakDuration', 'Break (s)', 0)">
                </div>
                <div class="field">
                    <label>DOCTOR TIMER (s)</label>
                    <input type="text" id="doctorDuration" value="180" readonly onclick="openKeypad('doctorDuration', 'Doctor timer (s)', 0)">
                </div>

                <div class="match-nav">
                    <button class="nav-btn" id="prevMatchBtn" disabled>◀◀ PREV.</button>
                    <div class="field">
                        <label>MATCH</label>
                        <input type="text" id="matchNumber" value="1" readonly onclick="openKeypad('matchNumber', 'Match number', 1)">
                    </div>
                    <button class="nav-btn" id="nextMatchBtn" disabled>NEXT ▶▶</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCORE / NAME / TIMER ROW -->
    <div class="score-row">

<script>
    // ── CONSTANTS ──
    let localIp = null;
    
    // ── TIMER STATE ──
    let totalSeconds = parseInt(document.getElementById("roundDuration").value);
    let remainingSeconds = totalSeconds;
    let timerInterval = null;
    let isRunning = false;
    let isBreakPhase = false;

    const timerDisplay = document.getElementById("timerDisplay");
    const startStopBtn = document.getElementById("startStopBtn");
    const startStopLabel = document.getElementById("startStopLabel");
    const startStopIcon = document.getElementById("startStopIcon");
    const stateDot = document.getElementById("stateDot");
    const stateText = document.getElementById("stateText");

    // ── SOUNDS ──
    const gongSound = document.getElementById('gong_sound');
    
    // ── ACTIONS ──
    const ACTION_CONNECTED = "connected";
    const ACTION_UPDATE_SCORE = "update_score";

    // ── INIT ──
    async function init() {
        try {
            
            const res = await fetch(`http://localhost:8080/api/login/admin`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ eventId: 6, ringId: 1, specialty: "SP" })
            });
            if (!res.ok) throw new Error(`Login failed (HTTP ${res.status})`);
            const data = await res.json();

            console.log("Login successful:", data);
            localIp = data.localIp;

            const eventSource = new EventSource(`http://${localIp}:8080/stream/admin`);
            console.log("Event stream initialized on", `http://${localIp}:8080/stream/admin`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log("Event received:", data);

                if (data.action === ACTION_CONNECTED) {
                    markRefereeConnected(data.referee);
                }

                if (data.action === ACTION_UPDATE_SCORE) {
                    updateRefereeScore(data.referee, data.score);
                }
            };

        } catch (err) {
            
            console.error("Initialization error:", err);
            showErrorModal("Login failed", "Could not connect to the local server. Please check that the server is running and try again.");
        }
    }

    // ── ERROR MODAL ──
    function showErrorModal(title, message) {
        document.getElementById("errorModalTitle").textContent = title;
        document.getElementById("errorModalMessage").textContent = message;
        document.getElementById("errorModalOverlay").classList.remove("hidden");
    }

    function closeErrorModal() {
        document.getElementById("errorModalOverlay").classList.add("hidden");
    }

    function closeErrorModalOnBackdrop(event) {
        if (event.target.id === "errorModalOverlay") closeErrorModal();
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, "0");
        const s = (seconds % 60).toString().padStart(2, "0");
        return `${m}:${s}`;
    }

    function renderTimer() {
        timerDisplay.textContent = formatTime(remainingSeconds);
        timerDisplay.classList.remove("running", "warning");
        if (isRunning) {
            timerDisplay.classList.add(remainingSeconds <= 10 ? "warning" : "running");
        }
    }

    function setState(running) {
        isRunning = running;
        if (running) {
            stateDot.classList.add("play");
            stateText.classList.remove("stop");
            stateText.classList.add("play");
            stateText.textContent = "PLAY";
            timerDisplay.classList.add(remainingSeconds <= 10 ? "warning" : "running");
        } else {
            stateDot.classList.remove("play");
            stateText.classList.remove("play");
            stateText.classList.add("stop");
            stateText.textContent = "STOP";
            startStopLabel.textContent = "START";
            startStopIcon.textContent = "▶";
            timerDisplay.classList.remove("running", "warning");
        }
        renderTimer();
    }

    // Updates only the START/PAUSE/RESUME label without touching server state
    function setButtonLabel(label, icon) {
        startStopLabel.textContent = label;
        startStopIcon.textContent = icon;
    }

    async function updateMatchStatus(state) {
        try {
            const base = localIp ? `http://${localIp}:8080` : "http://localhost:8080";
            const res = await fetch(`${base}/api/match/status`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ state })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
        } catch (err) {
            console.error("Match status update error:", err);
        }
    }

    function tick() {
        if (remainingSeconds <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;

            if (isBreakPhase) {
                onBreakFinished();
            } else {
                onRoundFinished();
            }
            return;
        }
        remainingSeconds -= 1;
        renderTimer();
        if (remainingSeconds <= 10) {
            timerDisplay.classList.add("warning");
        }
    }

    function onRoundFinished() {
        setState(false);

        const currentRound = parseInt(document.getElementById("roundIndicator").textContent) || 1;
        const totalRounds = parseInt(document.getElementById("roundTotal").textContent) || 1;

        if (currentRound >= totalRounds) {
            showInfoModal("Match finished", "All rounds have been completed.", "OK");
            return;
        }

        showInfoModal(
            `Round ${currentRound} finished`,
            "Click below to start the break before the next round.",
            "START BREAK",
            startBreak
        );
    }

    function startBreak() {
        isBreakPhase = true;
        isRunning = true;
        updateMatchStatus("stop");

        totalSeconds = parseInt(document.getElementById("breakDuration").value) || 60;
        remainingSeconds = totalSeconds;

        stateDot.classList.remove("play");
        stateText.classList.remove("play");
        stateText.classList.add("stop");
        stateText.textContent = "BREAK";

        renderTimer();
        timerInterval = setInterval(tick, 1000);
    }

    function onBreakFinished() {
        isBreakPhase = false;

        const currentRound = parseInt(document.getElementById("roundIndicator").textContent) || 1;
        document.getElementById("roundIndicator").textContent = currentRound + 1;

        totalSeconds = parseInt(document.getElementById("roundDuration").value) || 120;
        remainingSeconds = totalSeconds;

        setState(false);
        setButtonLabel("START", "▶");
    }

    // ── INFO MODAL (round/match transitions) ──
    function showInfoModal(title, message, buttonText = null, onConfirm = null) {
        document.getElementById("infoModalTitle").textContent = title;
        document.getElementById("infoModalMessage").textContent = message;

        const footer = document.getElementById("infoModalFooter");
        const btn = document.getElementById("infoModalBtn");

        if (buttonText) {
            footer.classList.remove("hidden");
            btn.textContent = buttonText;
            btn.onclick = () => {
                closeInfoModal();
                if (onConfirm) onConfirm();
            };
        } else {
            footer.classList.add("hidden");
        }

        document.getElementById("infoModalOverlay").classList.remove("hidden");
    }

    function closeInfoModal() {
        document.getElementById("infoModalOverlay").classList.add("hidden");
    }

    function closeInfoModalOnBackdrop(event) {
        if (event.target.id === "infoModalOverlay") closeInfoModal();
    }

    // Starts the timer for the first time in this round — this is the only
    // point (besides RESET ALL) where the server is notified of a state change.
    function startTimer() {
        if (timerInterval) return;
        setState(true);
        setButtonLabel("PAUSE", "❙❙");
        gongSound.play();
        timerInterval = setInterval(tick, 1000);
        updateMatchStatus("play");
    }

    // Pauses the countdown locally — does NOT notify the server.
    function pauseTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        isRunning = false;
        stateDot.classList.remove("play");
        timerDisplay.classList.remove("running", "warning");
        setButtonLabel("RESUME", "▶");
        renderTimer();
    }

    // Resumes a paused countdown locally — does NOT notify the server.
    function resumeTimer() {
        if (timerInterval) return;
        isRunning = true;
        stateDot.classList.add("play");
        timerDisplay.classList.add(remainingSeconds <= 10 ? "warning" : "running");
        setButtonLabel("PAUSE", "❙❙");
        timerInterval = setInterval(tick, 1000);
        renderTimer();
    }

    // RESET ALL is the only other action that notifies the server ("stop").
    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        setState(false);
        updateMatchStatus("stop");
    }

    startStopBtn.addEventListener("click", () => {
        const label = startStopLabel.textContent;
        if (label === "START") {
            startTimer();
        } else if (label === "PAUSE") {
            pauseTimer();
        } else if (label === "RESUME") {
            resumeTimer();
        }
    });

    document.getElementById("resetAllBtn").addEventListener("click", () => {
        stopTimer();
        closeInfoModal();

        isBreakPhase = false;
        document.getElementById("roundIndicator").textContent = "1";

        totalSeconds = parseInt(document.getElementById("roundDuration").value) || 120;
        remainingSeconds = totalSeconds;
        renderTimer();
        setButtonLabel("START", "▶");

        // Reset score displays
        ["wScoreLeft", "wScoreRight", "pScoreLeft", "pScoreRight", "mainScoreLeft", "mainScoreRight"].forEach(id => {
            document.getElementById(id).textContent = "0";
        });

        // Reset every referee's individual score back to zero
        for (let i = 1; i <= refereeCount; i++) {
            if (!refereeState[i]) continue;
            refereeState[i].score = { red: 0, blue: 0 };

            const redBox = document.getElementById(`refScoreRed${i}`);
            const blueBox = document.getElementById(`refScoreBlue${i}`);
            if (redBox) redBox.textContent = "0";
            if (blueBox) blueBox.textContent = "0";

            if (refereeState[i].connected) {
                notifyRefereeScore(i, refereeState[i].score);
            }
        }
    });

    document.getElementById("roundDuration").addEventListener("change", (e) => {
        if (!isRunning) {
            totalSeconds = parseInt(e.target.value) || 120;
            remainingSeconds = totalSeconds;
            renderTimer();
        }
    });

    // ── KEYPAD ──
    let keypadTargetId = null;
    let keypadMin = 0;
    let keypadValue = "";
    let keypadAllowNegative = false;
    let keypadOnConfirm = null;

    // targetId: id of an <input> to update directly (legacy behavior), or null
    // when using a custom onConfirm callback instead (e.g. referee score boxes).
    function openKeypad(targetId, title, min, options = {}) {
        keypadTargetId = targetId;
        keypadMin = min;
        keypadAllowNegative = options.allowNegative ?? false;
        keypadOnConfirm = options.onConfirm ?? null;

        const startValue = options.initialValue ?? (targetId ? document.getElementById(targetId).value : "");
        keypadValue = startValue !== undefined && startValue !== null ? String(startValue) : "";

        document.getElementById("keypadTitle").textContent = title;
        document.getElementById("keypadDisplay").value = keypadValue || "0";
        document.getElementById("keypadSignBtn").disabled = !keypadAllowNegative;
        document.getElementById("keypadOverlay").classList.remove("hidden");

        const displayInput = document.getElementById("keypadDisplay");
        setTimeout(() => {
            displayInput.focus();
            displayInput.select();
        }, 0);
    }

    function closeKeypad() {
        document.getElementById("keypadOverlay").classList.add("hidden");
        keypadTargetId = null;
        keypadOnConfirm = null;
        keypadAllowNegative = false;
    }

    function closeKeypadOnBackdrop(event) {
        if (event.target.id === "keypadOverlay") closeKeypad();
    }

    // ── CATEGORY MODAL ──
    function openCategoryModal() {
        document.getElementById("categoryModalOverlay").classList.remove("hidden");
    }

    function closeCategoryModal() {
        document.getElementById("categoryModalOverlay").classList.add("hidden");
    }

    function closeCategoryModalOnBackdrop(event) {
        if (event.target.id === "categoryModalOverlay") closeCategoryModal();
    }

    function refreshCategoryList() {
        // Placeholder — will fetch real category list from server
        showToast("Category list refreshed");
    }

    function loadCategory() {
        const select = document.getElementById("categorySelect");
        const selected = select.options[select.selectedIndex].text;
        document.getElementById("categoryDisplay").textContent = selected;
        closeCategoryModal();
        showToast("Category loaded");
    }

    function keypadPress(digit) {
        if (keypadValue.length >= 6) return; // reasonable max length
        keypadValue += digit;
        document.getElementById("keypadDisplay").value = keypadValue;
    }

    function keypadBackspace() {
        keypadValue = keypadValue.slice(0, -1);
        document.getElementById("keypadDisplay").value = keypadValue || "0";
    }

    function keypadClear() {
        keypadValue = "";
        document.getElementById("keypadDisplay").value = "0";
    }

    function keypadToggleSign() {
        if (!keypadAllowNegative) return;
        if (keypadValue.startsWith("-")) {
            keypadValue = keypadValue.slice(1);
        } else if (keypadValue) {
            keypadValue = "-" + keypadValue;
        } else {
            keypadValue = "-";
        }
        document.getElementById("keypadDisplay").value = keypadValue || "0";
    }

    // Syncs keypadValue when the user types directly on a physical keyboard.
    function keypadOnInput(input) {
        let raw = input.value;

        // Keep only digits, and a leading minus sign if negatives are allowed
        let sign = "";
        if (keypadAllowNegative && raw.startsWith("-")) {
            sign = "-";
            raw = raw.slice(1);
        }
        const digits = raw.replace(/[^0-9]/g, "").slice(0, 6);

        keypadValue = sign + digits;
        input.value = keypadValue;
    }

    function keypadOnKeydown(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            confirmKeypad();
        } else if (event.key === "Escape") {
            event.preventDefault();
            closeKeypad();
        }
    }

    function confirmKeypad() {
        if (!keypadTargetId && !keypadOnConfirm) return;

        let value = parseInt(keypadValue);
        if (isNaN(value)) value = keypadMin;
        if (!keypadAllowNegative && value < keypadMin) value = keypadMin;

        if (keypadOnConfirm) {
            keypadOnConfirm(value);
        } else {
            const input = document.getElementById(keypadTargetId);
            input.value = value;
            input.dispatchEvent(new Event("change"));
        }

        closeKeypad();
    }

    // Sync ROUND total display with ROUND NUMBER field
    document.getElementById("roundCount").addEventListener("change", (e) => {
        document.getElementById("roundTotal").textContent = e.target.value;
    });

    // ── WARNING / PENALTY LOGIC ──
    // Every 3 warnings (W) for a color, 1 point is automatically removed (P+1, shown as -P).
    function bindWarningCounter(plusId, minusId, wDisplayId, color) {
        const wDisplay = document.getElementById(wDisplayId);

        document.getElementById(plusId).addEventListener("click", () => {
            const newW = parseInt(wDisplay.textContent) + 1;
            wDisplay.textContent = newW;

            if (newW % 3 === 0) {
                subtractPointFromAllReferees(color);
                showToast(`3 warnings reached — 1 point removed from all referees (${color})`);
            }
        });

        document.getElementById(minusId).addEventListener("click", () => {
            wDisplay.textContent = Math.max(0, parseInt(wDisplay.textContent) - 1);
        });
    }

    // Subtracts 1 point from the given color for every referee, updates their
    // card display, then recalculates the main majority-vote score.
    function subtractPointFromAllReferees(color) {
        for (let i = 1; i <= refereeCount; i++) {
            const ref = refereeState[i];
            if (!ref || !ref.connected) continue;

            ref.score[color] = (parseFloat(ref.score[color]) || 0) - 1;

            const box = document.getElementById(`refScore${color === "red" ? "Red" : "Blue"}${i}`);
            if (box) box.textContent = ref.score[color];

            notifyRefereeScore(i, ref.score);
        }
        recalculateMainScore();
    }

    // Opens the keypad to manually edit a single referee's score for one color.
    function editRefereeScore(refereeId, color) {
        const ref = refereeState[refereeId];
        if (!ref) return;

        openKeypad(null, `Referee ${refereeId} — ${color.toUpperCase()} score`, 0, {
            allowNegative: true,
            initialValue: ref.score[color],
            onConfirm: (value) => {
                ref.score[color] = value;

                const box = document.getElementById(`refScore${color === "red" ? "Red" : "Blue"}${refereeId}`);
                if (box) box.textContent = value;

                recalculateMainScore();

                if (ref.connected) {
                    notifyRefereeScore(refereeId, ref.score);
                }

                showToast(`Referee ${refereeId} ${color} score set to ${value}`);
            }
        });
    }

    // Resets a single referee's score back to zero (local UI + main score + server notify).
    function resetRefereeScore(refereeId) {
        const ref = refereeState[refereeId];
        if (!ref) return;

        ref.score = { red: 0, blue: 0 };

        const redBox = document.getElementById(`refScoreRed${refereeId}`);
        const blueBox = document.getElementById(`refScoreBlue${refereeId}`);
        if (redBox) redBox.textContent = "0";
        if (blueBox) blueBox.textContent = "0";

        recalculateMainScore();

        if (ref.connected) {
            notifyRefereeScore(refereeId, ref.score);
        }

        showToast(`Referee ${refereeId} score reset`);
    }

    // Notifies the server (and therefore the referee's tablet) of a score
    // change that originated from the admin panel (warnings, penalties, reset).
    async function notifyRefereeScore(refereeId, score) {
        try {
            const base = localIp ? `http://${localIp}:8080` : "http://localhost:8080";
            const res = await fetch(`${base}/api/score/referee/${refereeId}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    action: "reset_score",
                    score: { red: score.red, blue: score.blue }
                })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
        } catch (err) {
            console.error(`Failed to notify referee ${refereeId} of score update:`, err);
        }
    }

    function bindPenaltyMinus(minusId, pDisplayId) {
        document.getElementById(minusId).addEventListener("click", () => {
            const pDisplay = document.getElementById(pDisplayId);
            pDisplay.textContent = Math.max(0, parseInt(pDisplay.textContent) - 1);
        });
    }

    function bindPenaltyPlus(plusId, pDisplayId, color) {
        document.getElementById(plusId).addEventListener("click", () => {
            const pDisplay = document.getElementById(pDisplayId);
            pDisplay.textContent = parseInt(pDisplay.textContent) + 1;

            subtractPointFromAllReferees(color);
            showToast(`Penalty given — 1 point removed from all referees (${color})`);
        });
    }

    bindWarningCounter("wPlusLeft",  "wMinusLeft",  "wScoreLeft",  "red");
    bindWarningCounter("wPlusRight", "wMinusRight", "wScoreRight", "blue");
    bindPenaltyMinus("pMinusLeft",  "pScoreLeft");
    bindPenaltyMinus("pMinusRight", "pScoreRight");
    bindPenaltyPlus("pPlusLeft",  "pScoreLeft",  "red");
    bindPenaltyPlus("pPlusRight", "pScoreRight", "blue");

    renderTimer();

    // ── REFEREES ──
    const refereeCount = 4;
    const refereesGrid = document.getElementById("refereesGrid");

    // Placeholder state per referee; real values come from /api/login/admin + /api/tablet/url later
    const refereeState = {};
    for (let i = 1; i <= refereeCount; i++) {
        refereeState[i] = { score: { red: 0, blue: 0 }, code: null, url: null, connected: false };
    }

    function renderReferees() {
        refereesGrid.innerHTML = "";
        for (let i = 1; i <= refereeCount; i++) {
            const card = document.createElement("div");
            card.className = "referee-card";
            card.innerHTML = `
                <div class="referee-title">Referee ${i}</div>
                <div class="referee-score-row">
                    <div class="referee-score-box red" id="refScoreRed${i}" onclick="editRefereeScore(${i}, 'red')">0</div>
                    <div class="referee-score-box blue" id="refScoreBlue${i}" onclick="editRefereeScore(${i}, 'blue')">0</div>
                </div>
                <div class="referee-btn-row">
                    <button class="referee-btn auth" id="refAuth${i}">AUTH</button>
                    <button class="referee-btn reset" id="refReset${i}">RESET</button>
                </div>
                <div class="referee-btn-row">
                    <button class="referee-btn copy" id="refCode${i}" ${refereeState[i].code ? "" : "disabled"}>
                        <span class="copy-icon">⧉</span> ${refereeState[i].code ?? "CODE"}
                    </button>
                    <button class="referee-btn copy" id="refUrl${i}" ${refereeState[i].url ? "" : "disabled"}>
                        <span class="copy-icon">⧉</span> URL
                    </button>
                </div>
            `;
            refereesGrid.appendChild(card);

            // AUTH — calls /api/tablet/url/:id, shows QR + copyable link
            document.getElementById(`refAuth${i}`).addEventListener("click", () => {
                authReferee(i);
            });

            // RESET — resets this referee's score to zero and notifies the server
            document.getElementById(`refReset${i}`).addEventListener("click", () => {
                resetRefereeScore(i);
            });

            // CODE — copy to clipboard
            document.getElementById(`refCode${i}`).addEventListener("click", () => {
                if (!refereeState[i].code) return;
                copyToClipboard(refereeState[i].code, `Code for Referee ${i} copied`);
            });

            // URL — copy to clipboard
            document.getElementById(`refUrl${i}`).addEventListener("click", () => {
                if (!refereeState[i].url) return;
                copyToClipboard(refereeState[i].url, `URL for Referee ${i} copied`);
            });
        }
    }

    function copyToClipboard(text, message) {
        navigator.clipboard.writeText(text)
            .then(() => showToast(message))
            .catch(() => showToast("Copy failed"));
    }

    // ── REFEREE AUTH ──
    let currentAuthRefereeId = null;

    async function authReferee(refereeId) {
        try {
            const base = localIp ? `http://${localIp}:8080` : "http://localhost:8080";
            const res = await fetch(`${base}/api/tablet/url/${refereeId}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            if (!data.ok || !data.url) throw new Error("Invalid response");

            refereeState[refereeId].url = data.url;

            // Enable the URL copy button on the card now that we have a value
            const urlBtn = document.getElementById(`refUrl${refereeId}`);
            if (urlBtn) {
                urlBtn.disabled = false;
                urlBtn.innerHTML = `<span class="copy-icon">⧉</span> URL`;
            }

            openAuthModal(refereeId, data.url);

        } catch (err) {
            console.error("Referee auth error:", err);
            showErrorModal("Authentication failed", `Could not generate the link for Referee ${refereeId}. Please check the server connection and try again.`);
        }
    }

    function openAuthModal(refereeId, url) {
        currentAuthRefereeId = refereeId;
        document.getElementById("authModalTitle").textContent = `Referee ${refereeId} link`;
        document.getElementById("authUrlInput").value = url;

        const qrBox = document.getElementById("authQrBox");
        qrBox.innerHTML = "";
        const canvas = document.createElement("canvas");
        qrBox.appendChild(canvas);
        QRCode.toCanvas(canvas, url, { width: 220, margin: 1 }, (err) => {
            if (err) console.error("QR generation error:", err);
        });

        document.getElementById("authModalOverlay").classList.remove("hidden");
    }

    function closeAuthModal() {
        document.getElementById("authModalOverlay").classList.add("hidden");
        currentAuthRefereeId = null;
    }

    function closeAuthModalOnBackdrop(event) {
        if (event.target.id === "authModalOverlay") closeAuthModal();
    }

    function copyAuthUrl() {
        const url = document.getElementById("authUrlInput").value;
        copyToClipboard(url, "Link copied to clipboard");
    }

    // ── REFEREE CONNECTED ──
    function markRefereeConnected(refereeId) {
        if (!refereeState[refereeId]) return;
        refereeState[refereeId].connected = true;

        const redBox = document.getElementById(`refScoreRed${refereeId}`);
        const blueBox = document.getElementById(`refScoreBlue${refereeId}`);
        if (redBox) redBox.classList.add("connected");
        if (blueBox) blueBox.classList.add("connected");

        // Close the AUTH modal if it's currently open for this referee
        if (currentAuthRefereeId === refereeId) {
            closeAuthModal();
        }

        showToast(`Referee ${refereeId} connected`);
    }

    // ── REFEREE SCORE UPDATE ──
    function updateRefereeScore(refereeId, score) {
        if (!refereeState[refereeId] || !score) return;

        refereeState[refereeId].score = score;

        const redBox = document.getElementById(`refScoreRed${refereeId}`);
        const blueBox = document.getElementById(`refScoreBlue${refereeId}`);
        if (redBox) redBox.textContent = score.red ?? 0;
        if (blueBox) blueBox.textContent = score.blue ?? 0;

        recalculateMainScore();
    }

    // Main score = how many referees currently favor red vs blue (majority voting).
    // A referee favors the color with the higher score; ties count for neither.
    function recalculateMainScore() {
        let redVotes = 0;
        let blueVotes = 0;

        for (let i = 1; i <= refereeCount; i++) {
            const ref = refereeState[i];
            if (!ref || !ref.connected || !ref.score) continue;

            const red = parseFloat(ref.score.red) || 0;
            const blue = parseFloat(ref.score.blue) || 0;

            if (red > blue) redVotes++;
            else if (blue > red) blueVotes++;
        }

        document.getElementById("mainScoreLeft").textContent = redVotes;
        document.getElementById("mainScoreRight").textContent = blueVotes;
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2200);
    }

    renderReferees();

    window.addEventListener("load", init);
</script>

</body>
</html>
