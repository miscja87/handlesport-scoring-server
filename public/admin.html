<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <link rel="icon" href="/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1f2e;
            font-family: 'Arial', sans-serif;
            color: #e8eaf0;
            min-height: 100vh;
            padding: 20px 24px;
        }

        .panel {
            width: 100%;
            margin: 0;
        }

        /* ── TOP BAR ── */
        .topbar {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 32px;
        }

        .topbar-row2 {
            display: grid;
            grid-template-columns: 70px 110px 1fr 110px 110px 110px 110px 1fr 110px 70px;
            gap: 14px;
            align-items: flex-end;
        }

        .topbar .ring-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .topbar .ring-title .event-name {
            color: #a0aab8;
            font-weight: 400;
        }

        .display-toggle-btn {
            margin-left: 16px;
            background: #2a3550;
            border: 1px solid #3a4560;
            color: #c8ccd8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            vertical-align: middle;
        }
        .display-toggle-btn.active {
            background: #2a9a5a;
            border-color: #2a9a5a;
            color: white;
        }
        .display-toggle-btn:active { filter: brightness(1.2); }

        /* ── CATEGORY BAR ── */
        .category-bar {
            display: grid;
            grid-template-columns: 70px 110px 1fr 110px;
            gap: 14px;
            grid-column: 1 / 5;
        }
        .category-display {
            grid-column: 1 / 4;
            background: #252d3f;
            border: 1px solid #3a4560;
            color: #e8eaf0;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .load-btn {
            grid-column: 4;
            background: #1a6fa8;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 14px;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .load-btn:active { filter: brightness(1.2); }

        /* ── CATEGORY MODAL ── */
        .category-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .category-modal {
            background: #1f2638;
            border-radius: 10px;
            width: 460px;
            max-width: 90vw;
            overflow: hidden;
        }
        .category-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid #2a3550;
        }
        .category-modal-header h3 {
            color: #4a9fd8;
            font-size: 18px;
            font-weight: 700;
        }
        .category-modal-close {
            background: none;
            border: none;
            color: #8a93a8;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }
        .category-modal-close:active { color: white; }
        .category-modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .category-select {
            background: #252d3f;
            border: 1px solid #3a4560;
            color: #e8eaf0;
            padding: 12px 14px;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
            outline: none;
        }
        .category-modal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            padding: 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        .category-modal-btn:active { filter: brightness(1.2); }
        .category-modal-btn.refresh { background: #1a6fa8; }
        .category-modal-btn.load { background: #2a9a5a; }

        /* ── ERROR MODAL ── */
        .error-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-modal {
            background: #1f2638;
            border-radius: 10px;
            width: 380px;
            max-width: 90vw;
            overflow: hidden;
            border: 1px solid #5a2a30;
        }
        .error-modal-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 20px;
            border-bottom: 1px solid #2a3550;
        }
        .error-modal-header .error-icon {
            color: #e05a5a;
            font-size: 20px;
        }
        .error-modal-header h3 {
            color: #e05a5a;
            font-size: 16px;
            font-weight: 700;
        }
        .error-modal-body {
            padding: 20px;
            color: #c8ccd8;
            font-size: 14px;
            line-height: 1.5;
        }
        .error-modal-footer {
            padding: 0 20px 20px;
        }
        .error-modal-footer button {
            width: 100%;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            background: #cc3340;
        }
        .error-modal-footer button:active { filter: brightness(1.2); }

        /* ── INFO MODAL (round/match transitions) ── */
        .info-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .info-modal {
            background: #1f2638;
            border-radius: 10px;
            width: 380px;
            max-width: 90vw;
            overflow: hidden;
            border: 1px solid #2a5a7a;
        }
        .info-modal-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 20px;
            border-bottom: 1px solid #2a3550;
        }
        .info-modal-header .info-icon {
            color: #4a9fd8;
            font-size: 20px;
        }
        .info-modal-header h3 {
            color: #4a9fd8;
            font-size: 16px;
            font-weight: 700;
        }
        .info-modal-body {
            padding: 20px;
            color: #c8ccd8;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ── WINNER MODAL ── */
        .winner-modal-score {
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            color: white;
            margin: 4px 0 16px;
        }
        .winner-modal-score .red-text  { color: #e05a5a; }
        .winner-modal-score .blue-text { color: #4a9fd8; }
        .winner-btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 20px 20px;
        }
        .winner-btn {
            border: none;
            color: white;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 1px;
            padding: 16px;
            border-radius: 6px;
            cursor: pointer;
            background: #3a4560;
            opacity: 0.6;
            transition: opacity 0.15s, filter 0.1s;
        }
        .winner-btn:active { filter: brightness(1.2); }
        .winner-btn.red { background: #cc0000; }
        .winner-btn.blue { background: #1a6fa8; }
        .winner-btn.suggested { opacity: 1; box-shadow: 0 0 0 2px white inset; }
        .winner-cancel-row {
            padding: 0 20px 20px;
        }
        .winner-cancel-btn {
            width: 100%;
            background: none;
            border: 1px solid #3a4560;
            color: #8a93a8;
            font-size: 13px;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        .winner-cancel-btn:active { background: #252d3f; }

        /* ── REFEREE AUTH MODAL ── */
        .auth-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 250;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-modal {
            background: #1f2638;
            border-radius: 10px;
            width: 360px;
            max-width: 90vw;
            overflow: hidden;
        }
        .auth-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid #2a3550;
        }
        .auth-modal-header h3 {
            color: #4a9fd8;
            font-size: 16px;
            font-weight: 700;
        }
        .auth-modal-close {
            background: none;
            border: none;
            color: #8a93a8;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }
        .auth-modal-close:active { color: white; }
        .auth-modal-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .auth-qr-box {
            background: white;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-qr-box canvas { display: block; }
        .auth-url-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .auth-url-input {
            flex: 1;
            background: #252d3f;
            border: 1px solid #3a4560;
            color: #e8eaf0;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
            min-width: 0;
        }
        .auth-copy-btn {
            background: #1a6fa8;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 13px;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .auth-copy-btn:active { filter: brightness(1.2); }

        .topbar-fields {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            align-items: flex-end;
            grid-column: 5 / 11;
            justify-content: flex-end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field label {
            font-size: 11px;
            color: #a0aab8;
            letter-spacing: 0.5px;
        }
        .field input {
            background: #252d3f;
            border: 1px solid #3a4560;
            color: #e8eaf0;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 14px;
            width: 80px;
            outline: none;
            cursor: pointer;
        }
        .field input:focus { border-color: #1a6fa8; }
        .field input:active { background: #2a3550; }

        /* ── KEYPAD MODAL ── */
        .keypad-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .keypad-modal {
            background: #1f2638;
            border-radius: 14px;
            padding: 20px;
            width: 280px;
        }
        .keypad-title {
            color: #a0aab8;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            text-align: center;
        }
        .keypad-display {
            background: #252d3f;
            border: 1px solid #3a4560;
            border-radius: 8px;
            color: white;
            font-size: 28px;
            font-weight: 900;
            text-align: center;
            padding: 14px;
            margin-bottom: 14px;
            font-variant-numeric: tabular-nums;
            min-height: 28px;
            width: 100%;
            outline: none;
            font-family: inherit;
        }
        .keypad-display:focus { border-color: #1a6fa8; }
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .keypad-key {
            background: #2a3550;
            border: none;
            color: white;
            font-size: 20px;
            font-weight: 700;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .keypad-key:active { filter: brightness(1.3); }
        .keypad-key.wide { grid-column: span 1; }
        .keypad-key:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .keypad-key:disabled:active { filter: none; }
        .keypad-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .keypad-actions button {
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            color: white;
        }
        .keypad-cancel { background: #3a4560; color: #a0aab8; }
        .keypad-confirm { background: #1a6fa8; }
        .keypad-actions button:active { filter: brightness(1.2); }

        .hidden { display: none !important; }

        .match-nav {
            display: flex;
            align-items: flex-end;
            gap: 6px;
        }
        .match-nav .field input { width: 60px; text-align: center; }

        .match-status-row {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .match-status-badge {
            display: none;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
            padding: 6px 18px;
            border-radius: 20px;
            text-transform: uppercase;
            color: white;
        }
        .match-status-badge.visible { display: inline-block; }
        .match-status-badge.idle        { background: #4a5578; }
        .match-status-badge.in_progress { background: #c98a1f; }
        .match-status-badge.completed   { background: #2a9a5a; }

        .nav-btn {
            background: #2a3550;
            border: none;
            color: #6a7590;
            padding: 9px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        .nav-btn:not(:disabled) { color: white; cursor: pointer; }
        .nav-btn:not(:disabled):active { filter: brightness(1.3); }
        .nav-btn:disabled { cursor: not-allowed; }

        /* ── SCORE ROW ── */
        .score-row {
            display: grid;
            grid-template-columns: 70px 110px 1fr 110px 110px 110px 110px 1fr 110px 70px;
            gap: 14px;
            align-items: stretch;
            margin-bottom: 28px;
        }

        .country-select {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 70px;
        }
        .country-select select {
            background: #252d3f;
            border: 1px solid #3a4560;
            color: #e8eaf0;
            padding: 8px 4px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            width: 100%;
            outline: none;
        }
        .flag {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #3a4560;
            display: block;
        }

        .name-bar {
            display: flex;
            align-items: center;
            padding: 0 18px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 1px;
            color: white;
        }
        .name-bar.red  { background: #cc0000; }
        .name-bar.blue { background: #1a6fa8; }

        .timer-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e0b400;
            border-radius: 6px;
            font-size: 32px;
            font-weight: 900;
            color: #1a1f2e;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            transition: filter 0.1s;
        }
        .timer-bar.running { background: #38a169; color: white; }
        .timer-bar.warning { background: #cc0000; color: white; }

        /* ── MAIN SCORE ── */
        .main-score-row {
            display: grid;
            grid-template-columns: 70px 110px 1fr 110px 110px 110px 110px 1fr 110px 70px;
            gap: 14px;
            align-items: center;
            margin-bottom: 14px;
        }
        .main-score {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100px;
            border-radius: 8px;
            font-size: 64px;
            font-weight: 900;
            color: white;
            grid-column: 1 / 5;
            cursor: pointer;
            transition: filter 0.1s;
        }
        .main-score:active { filter: brightness(1.15); }
        .main-score.red  { background: #cc0000; }
        .main-score.blue { background: #1a6fa8; grid-column: 7 / 11; }
        .round-label {
            text-align: center;
            color: #a0aab8;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            white-space: nowrap;
            grid-column: 5 / 7;
        }

        /* ── SCORE GRID ── */
        .score-grid-row {
            display: grid;
            grid-template-columns: 70px 110px 1fr 110px 110px 110px 110px 1fr 110px 70px;
            gap: 14px;
            margin-bottom: 14px;
        }

        .side-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            color: #6a7590;
            width: 28px;
        }
        .side-label.red-text  { color: #e05a5a; }
        .side-label.blue-text { color: #4a9fd8; }

        .adj-btn {
            border: none;
            color: white;
            font-weight: 900;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: filter 0.1s;
            min-height: 48px;
        }
        .adj-btn:active { filter: brightness(1.25); }
        .adj-btn.red  { background: #cc0000; }
        .adj-btn.blue { background: #1a6fa8; }

        .score-display {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 900;
            border-radius: 6px;
            color: white;
            min-height: 48px;
        }
        .score-display.red  { background: #cc0000; }
        .score-display.blue { background: #1a6fa8; }
        .score-display.center-display {
            background: #252d3f;
            color: #e8eaf0;
            font-size: 22px;
        }

        .action-row {
            display: grid;
            grid-template-columns: 70px 110px 1fr 110px 110px 110px 110px 1fr 110px 70px;
            gap: 14px;
            margin-bottom: 28px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: filter 0.1s;
        }
        .action-btn:active { filter: brightness(1.2); }
        .action-btn.red  { background: #cc0000; }
        .action-btn.blue { background: #1a6fa8; }
        .action-btn.green { background: #2a7a2a; }
        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }
        .action-btn .icon { font-size: 15px; }

        /* ── STATE INDICATOR ── */
        .state-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .state-dot {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            background: #e53e3e;
        }
        .state-dot.play { background: #38a169; }
        .state-text.stop { color: #e53e3e; }
        .state-text.play { color: #38a169; }

        @media (max-width: 900px) {
            .score-grid-row {
                grid-template-columns: repeat(2, 1fr);
                grid-template-areas:
                    "labelL labelR"
                    "adjL adjR"
                    "scoreL scoreR"
                    "adjL2 adjR2"
                    "score2L score2R";
            }
        }

        /* ── REFEREES SECTION ── */
        .referees-section {
            margin-top: 36px;
            padding-top: 28px;
            border-top: 1px solid #2a3550;
        }
        .referees-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }
        .referee-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .referee-title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .referee-title {
            text-align: center;
            color: #8a93a8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .referee-toggle {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }
        .referee-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .referee-toggle-slider {
            position: absolute;
            inset: 0;
            background: #3a4560;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .referee-toggle-slider::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            left: 2px;
            top: 2px;
            background: white;
            border-radius: 50%;
            transition: transform 0.15s;
        }
        .referee-toggle input:checked + .referee-toggle-slider {
            background: #2a9a5a;
        }
        .referee-toggle input:checked + .referee-toggle-slider::before {
            transform: translateX(16px);
        }

        .referee-card.disabled-referee {
            opacity: 0.45;
        }
        .referee-card.disabled-referee .referee-score-box,
        .referee-card.disabled-referee .referee-btn {
            pointer-events: none;
        }
        .referee-score-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .referee-score-box {
            background: #252d3f;
            border: 1px solid #3a4560;
            color: #5a6580;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .referee-score-box:active { filter: brightness(1.3); }
        .referee-score-box.connected.red {
            background: #cc0000;
            color: white;
            border-color: #cc0000;
        }
        .referee-score-box.connected.blue {
            background: #1a6fa8;
            color: white;
            border-color: #1a6fa8;
        }
        .referee-btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .referee-btn {
            border: none;
            color: white;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: filter 0.1s;
        }
        .referee-btn:active { filter: brightness(1.25); }
        .referee-btn.auth  { background: #1a6fa8; }
        .referee-btn.reset { background: #4a5578; }
        .referee-btn.copy {
            background: transparent;
            border: 1px solid #3a4560;
            color: #4a9a5a;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .referee-btn.copy:disabled {
            color: #5a6580;
            cursor: not-allowed;
            border-color: #2a3550;
        }
        .referee-btn.copy:not(:disabled):active { filter: brightness(1.3); }
        .referee-btn.copy .copy-icon { font-size: 12px; }

        @media (max-width: 900px) {
            .referees-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ── NEXT MATCH ── */
        .next-match-section {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #2a3550;
        }
        .next-match-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
        }
        .next-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: white;
        }
        .next-bar.red {
            background: linear-gradient(to right, #cc0000, #ff5a5a);
        }
        .next-bar.blue {
            background: linear-gradient(to right, #1a6fa8, #2a9ad8);
        }
        .next-bar .icon { font-size: 1.1em; opacity: 0.8; }
        .next-label {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #8a93a8;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 22px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 99;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="panel">

    <audio id="gong_sound"><source src="gong.mp3"></audio>

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="ring-title">RING <span id="ringNumber">1</span> - <span class="event-name" id="eventName">Test Event</span>
            <button class="display-toggle-btn" onclick="toggleDisplayWindow()" id="displayToggleBtn">📺 OPEN DISPLAY</button>
        </div>

        <div class="topbar-row2">
            <!-- CATEGORY BAR -->
            <div class="category-bar">
                <div class="category-display" id="categoryDisplay">No category loaded</div>
                <button class="load-btn" onclick="openCategoryModal()">Load</button>
            </div>

            <div class="topbar-fields">
                <div class="field">
                    <label>ROUND NUMBER</label>
                    <input type="text" id="roundCount" value="1" readonly onclick="openKeypad('roundCount', 'Round number', 1)">
                </div>
                <div class="field">
                    <label>ROUND DURATION (s)</label>
                    <input type="text" id="roundDuration" value="120" readonly onclick="openKeypad('roundDuration', 'Round duration (s)', 1)">
                </div>
                <div class="field">
                    <label>BREAK (s)</label>
                    <input type="text" id="breakDuration" value="60" readonly onclick="openKeypad('breakDuration', 'Break (s)', 0)">
                </div>
                <div class="field">
                    <label>DOCTOR TIMER (s)</label>
                    <input type="text" id="doctorDuration" value="180" readonly onclick="openKeypad('doctorDuration', 'Doctor timer (s)', 0)">
                </div>

                <div class="match-nav">
                    <button class="nav-btn" id="prevMatchBtn">◀◀ PREV.</button>
                    <div class="field">
                        <label>MATCH</label>
                        <input type="text" id="matchNumber" value="1" readonly onclick="openKeypad('matchNumber', 'Match number', 1)">
                    </div>
                    <button class="nav-btn" id="nextMatchBtn">NEXT ▶▶</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MATCH STATUS BADGE -->
    <div class="match-status-row">
        <span class="match-status-badge" id="matchStatusBadge"></span>
    </div>

    <!-- SCORE / NAME / TIMER ROW -->
    <div class="score-row">
        <div class="country-select" style="grid-column: 1;">
            <select id="countryLeft">
                <option>ITALY</option>
                <option>FRANCE</option>
                <option>SPAIN</option>
                <option>GERMANY</option>
            </select>
            <img class="flag" id="flagLeft" src="/images/flags/ITALY.png" alt="">
        </div>

        <div class="name-bar red" id="nameLeft" style="grid-column: 2 / 5;">RED</div>

        <div class="timer-bar" id="timerDisplay" style="grid-column: 5 / 7;" onclick="editRemainingTime()">02:00</div>

        <div class="name-bar blue" id="nameRight" style="grid-column: 7 / 10;">BLUE</div>

        <div class="country-select" style="grid-column: 10;">
            <select id="countryRight">
                <option>ITALY</option>
                <option>FRANCE</option>
                <option>SPAIN</option>
                <option>GERMANY</option>
            </select>
            <img class="flag" id="flagRight" src="/images/flags/ITALY.png" alt="">
        </div>
    </div>

    <!-- MAIN SCORE -->
    <div class="main-score-row">
        <div class="main-score red" id="mainScoreLeft" onclick="showWinnerModal(false)">0</div>
        <div class="round-label">ROUND<br><span id="roundIndicator">1</span>/<span id="roundTotal">1</span></div>
        <div class="main-score blue" id="mainScoreRight" onclick="showWinnerModal(false)">0</div>
    </div>

    <!-- W ROW -->
    <div class="score-grid-row">
        <div class="side-label red-text" style="grid-column: 1;">W</div>
        <button class="adj-btn red" id="wMinusLeft" style="grid-column: 2;">−</button>
        <div class="score-display red" id="wScoreLeft" style="grid-column: 3;">0</div>
        <button class="adj-btn red" id="wPlusLeft" style="grid-column: 4;">+ (Q)</button>
        <button class="action-btn green" id="resetAllBtn" style="grid-column: 5 / 7; font-size: 11px; padding: 8px 4px;">
            <span class="icon">↻</span> RESET ALL
        </button>
        <button class="adj-btn blue" id="wPlusRight" style="grid-column: 7;">+ (W)</button>
        <div class="score-display blue" id="wScoreRight" style="grid-column: 8;">0</div>
        <button class="adj-btn blue" id="wMinusRight" style="grid-column: 9;">−</button>
        <div class="side-label blue-text" style="grid-column: 10;">W</div>
    </div>

    <!-- P ROW -->
    <div class="score-grid-row">
        <div class="side-label red-text" style="grid-column: 1;">−P</div>
        <button class="adj-btn red" id="pMinusLeft" style="grid-column: 2;">−</button>
        <div class="score-display red" id="pScoreLeft" style="grid-column: 3;">0</div>
        <button class="adj-btn red" id="pPlusLeft" style="grid-column: 4;">+ (A)</button>
        <button class="action-btn green" id="startStopBtn" style="grid-column: 5 / 7; font-size: 11px; padding: 8px 4px;">
            <span class="icon" id="startStopIcon">▶</span> <span id="startStopLabel">START</span>
        </button>
        <button class="adj-btn blue" id="pPlusRight" style="grid-column: 7;">+ (S)</button>
        <div class="score-display blue" id="pScoreRight" style="grid-column: 8;">0</div>
        <button class="adj-btn blue" id="pMinusRight" style="grid-column: 9;">−</button>
        <div class="side-label blue-text" style="grid-column: 10;">−P</div>
    </div>

    <!-- ACTION ROW: doctor timers + state indicator at same height -->
    <div class="action-row" style="margin-bottom: 16px; align-items: center;">
        <button class="action-btn red" id="doctorTimerLeftBtn" style="grid-column: 2 / 5;">
            <span class="icon">👤</span> START DOCTOR TIMER RED
        </button>
        <div class="state-row" style="grid-column: 5 / 7; margin-bottom: 0;">
            <span>STATE</span>
            <span class="state-dot" id="stateDot"></span>
            <span class="state-text stop" id="stateText">STOP</span>
        </div>
        <button class="action-btn blue" id="doctorTimerRightBtn" style="grid-column: 7 / 10;">
            <span class="icon">👤</span> START DOCTOR TIMER BLUE
        </button>
    </div>

    <!-- REFEREES SECTION -->
    <div class="referees-section">
        <div class="referees-grid" id="refereesGrid">
            <!-- 4 referee cards generated below -->
        </div>
    </div>

    <!-- NEXT MATCH -->
    <div class="next-match-section">
        <div class="next-match-row">
            <div class="next-bar red"><span class="icon">👤</span><span id="nextMatchRed">RED</span></div>
            <div class="next-label">NEXT MATCH</div>
            <div class="next-bar blue"><span id="nextMatchBlue">BLUE</span><span class="icon">👤</span></div>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

<!-- KEYPAD MODAL -->
<div class="keypad-overlay hidden" id="keypadOverlay" onclick="closeKeypadOnBackdrop(event)">
    <div class="keypad-modal">
        <div class="keypad-title" id="keypadTitle">Value</div>
        <input type="text" inputmode="numeric" class="keypad-display" id="keypadDisplay" value="0" oninput="keypadOnInput(this)" onkeydown="keypadOnKeydown(event)">
        <div class="keypad-grid">
            <button class="keypad-key" onclick="keypadPress('1')">1</button>
            <button class="keypad-key" onclick="keypadPress('2')">2</button>
            <button class="keypad-key" onclick="keypadPress('3')">3</button>
            <button class="keypad-key" onclick="keypadPress('4')">4</button>
            <button class="keypad-key" onclick="keypadPress('5')">5</button>
            <button class="keypad-key" onclick="keypadPress('6')">6</button>
            <button class="keypad-key" onclick="keypadPress('7')">7</button>
            <button class="keypad-key" onclick="keypadPress('8')">8</button>
            <button class="keypad-key" onclick="keypadPress('9')">9</button>
            <button class="keypad-key" id="keypadSignBtn" onclick="keypadToggleSign()">±</button>
            <button class="keypad-key" onclick="keypadPress('0')">0</button>
            <button class="keypad-key" onclick="keypadBackspace()">⌫</button>

        </div>
        <div class="keypad-actions">
            <button class="keypad-cancel" onclick="closeKeypad()">Cancel</button>
            <button class="keypad-confirm" onclick="confirmKeypad()">OK</button>
        </div>

</div>

<!-- CATEGORY MODAL -->
<div class="category-modal-overlay hidden" id="categoryModalOverlay" onclick="closeCategoryModalOnBackdrop(event)">
    <div class="category-modal">
        <div class="category-modal-header">
            <h3>Category</h3>
            <button class="category-modal-close" onclick="closeCategoryModal()">✕</button>
        </div>
        <div class="category-modal-body">
            <select class="category-select" id="categorySelect">
            </select>
            <button class="category-modal-btn refresh" onclick="refreshCategoryList()">
                REFRESH LIST <span>↻</span>
            </button>
            <button class="category-modal-btn load" onclick="loadCategory()">
                LOAD CATEGORY <span>✓</span>
            </button>
        </div>
    </div>
</div>

<!-- ERROR MODAL -->
<div class="error-modal-overlay hidden" id="errorModalOverlay" onclick="closeErrorModalOnBackdrop(event)">
    <div class="error-modal">
        <div class="error-modal-header">
            <span class="error-icon">⚠</span>
            <h3 id="errorModalTitle">Error</h3>
