<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard — Pattern</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="display-shared.css">
    <style>
        /* ── SP-SPECIFIC STYLES ──
           Everything here is specific to the sparring central panel: main
           score, W/-P, round indicator, timer ring/countdown.
           Shared chrome (board, top row, name row, referee boxes,
           next-match, winner overlay) lives in display-shared.css. */

        /* ── CENTRAL PANEL: 3x3 grid, shared rows guarantee alignment ── */
        .central-panel {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            grid-template-rows: auto auto auto;
            align-items: center;
            justify-items: center;
            padding: 0.3vh 5vw;
            gap: 0.3vh 5vw;
        }

        .score-side-group {
            display: flex;
            align-items: center;
            width: 100%;
        }
        .blue-side-group { justify-self: stretch; justify-content: flex-start; }
        .red-side-group { justify-self: stretch; justify-content: flex-end; }
        .main-score {
            font-size: 36vh;
            font-weight: 900;
            line-height: 1;
            transition: text-shadow 0.4s ease-out;
        }
        .main-score.blue-text { color: #2aa8e0; }
        .main-score.red-text { color: #ff4444; }

        .main-score.leading {
            text-shadow: 0 0 0.4em currentColor, 0 0 0.8em currentColor;
        }

        @keyframes scoreBump {
            0%   { transform: scale(1);    filter: brightness(1); }
            30%  { transform: scale(1.3); filter: brightness(1.8); }
            100% { transform: scale(1);    filter: brightness(1); }
        }
        .main-score.bump {
            display: inline-block;
            transform-origin: center center;
            animation: scoreBump 0.5s ease-out !important;
        }

        .round-indicator {
            font-size: 6.5vh;
            font-weight: 900;
            color: white;
            letter-spacing: 1px;
            width: 40vh;
            text-align: center;
            margin-top: 0.3vh;
        }

        /* ── PATTERN START OVERLAY ── */
        .pattern-start-overlay {
            position: fixed;
            inset: 0;
            z-index: 90;
            background: rgba(2, 3, 6, 0.96);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: block;
        }
        .pattern-start-overlay.show {
            opacity: 1;
            transition: opacity 0.2s ease-in;
        }
        .pattern-start-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            font-size: 19vh;
            font-weight: 900;
            color: white;
            letter-spacing: 1px;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 0 1em rgba(255,255,255,0.4), 0 8px 24px rgba(0,0,0,0.5);
            z-index: 95;
        }
        .pattern-start-text.entering {
            animation: patternStartPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes patternStartPop {
            0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
            60%  { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .pattern-name-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90vh;
            gap: 1.2vh;
        }
        .pattern-name-display {
            color: white;
            font-size: 7.5vh;
            font-weight: 900;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.15;
            width: 100%;
            white-space: nowrap;
            text-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }

        /* ── TRAD.SPARRING TIMER ── */
        .trad-timer-display {
            color: white;
            font-size: 15vh;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 4px 16px rgba(0,0,0,0.5);
            margin-top: -0.8vh;
        }

        /* ── PLAY STATE INDICATOR BAR ── */
        .play-bar-track {
            width: 70%;
            height: 0.8vh;
            background: rgba(255,255,255,0.08);
            border-radius: 1vh;
            overflow: hidden;
            position: relative;
        }
        .play-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: #38e07a;
            border-radius: 1vh;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .play-bar-fill.running {
            opacity: 1;
            animation: playBarSlide 3.5s ease-in-out infinite;
        }
        @keyframes playBarSlide {
            0%   { left: -40%; }
            50%  { left: 100%; }
            100% { left: -40%; }
        }

    </style>
</head>
<body>

<div class="connecting" id="connecting">Waiting for admin panel...</div>

<div class="board">

<!-- WINNER ANNOUNCEMENT OVERLAY -->
<div class="winner-overlay" id="winnerOverlay">
    <div class="winner-content">
        <div class="winner-headline" id="winnerHeadline">
            <div class="winner-name-line" id="winnerNameLine">STEFANO</div>
            <div class="winner-wins-line">WINS</div>
        </div>
        <div class="winner-score" id="winnerScore"></div>
    </div>
</div>

<!-- PATTERN START OVERLAY -->
<div class="pattern-start-overlay" id="patternStartOverlay">
    <div class="pattern-start-text" id="patternStartText">CHOONG-JANG</div>
</div>


    <!-- TOP ROW -->
    <div class="top-row">
        <div class="ring-label">RING <span id="ringNumber">1</span></div>
        <div class="category-label" id="categoryLabel">Category</div>
        <div class="match-label">Match <span id="matchNumber">1</span></div>
    </div>

    <!-- NAME ROW -->
    <div class="name-row">
        <img class="flag" id="flagBlue" src="/images/flags/ITALY.png" alt="">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="name-blue" id="nameBlue">BLUE</div>
            <div class="name-red" id="nameRed">RED</div>
        </div>
        <img class="flag" id="flagRed" src="/images/flags/ITALY.png" alt="">
    </div>

    <!-- CENTRAL PANEL: blue stats | timer ring | red stats -->
    <div class="central-panel">
        <div></div>
        <div></div>
        <div></div>

        <div class="score-side-group blue-side-group">
            <div class="main-score blue-text blue-score" id="mainScoreBlue">0</div>
        </div>

        <div class="pattern-name-wrap">
            <div class="pattern-name-display" id="patternNameDisplay"></div>
            <div class="play-bar-track">
                <div class="play-bar-fill" id="playBarFill"></div>
            </div>
            <div class="trad-timer-display hidden" id="tradTimerDisplay">00:00</div>
        </div>

        <div class="score-side-group red-side-group">
            <div class="main-score red-text red-score" id="mainScoreRed">0</div>
        </div>

        <div></div>
        <div class="round-indicator" id="roundIndicatorRow">R <span id="roundIndicator">1</span>/<span id="roundTotal">1</span></div>
        <div></div>
    </div>

    <!-- REFEREES -->
    <div class="referee-section">
        <div class="referee-labels" id="refereeLabels"></div>
        <div class="referee-boxes" id="refereeBoxesP1"></div>
        <div class="referee-boxes" id="refereeBoxesP2" style="margin-top: 0.5vh;"></div>
        <div class="referee-boxes" id="refereeBoxesTotal" style="margin-top: 0.5vh;"></div>
    </div>

    <!-- NEXT MATCHES -->
    <div class="next-matches">
        <div class="next-match-row">
            <div class="next-bar blue"><span class="icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" style="vertical-align:-0.15em"><path d="M12 12c2.76 0 5-2.46 5-5.5S14.76 1 12 1 7 3.46 7 6.5 9.24 12 12 12zm0 2.5c-3.34 0-10 1.68-10 5v2.5h20V19.5c0-3.32-6.66-5-10-5z"/></svg></span><span id="next1Blue">BLUE</span></div>
            <div class="next-label">NEXT MATCH</div>
            <div class="next-bar red"><span id="next1Red">RED</span><span class="icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" style="vertical-align:-0.15em"><path d="M12 12c2.76 0 5-2.46 5-5.5S14.76 1 12 1 7 3.46 7 6.5 9.24 12 12 12zm0 2.5c-3.34 0-10 1.68-10 5v2.5h20V19.5c0-3.32-6.66-5-10-5z"/></svg></span></div>
        </div>
    </div>

</div>

<script src="display-shared.js"></script>
<script>

    // ── MAIN SCORE: bump animation on change + glow on the leading color (SP-specific) ──
    let lastScoreRed = null;
    let lastScoreBlue = null;

    function applyMainScore(red, blue) {
        const redEl = document.getElementById("mainScoreRed");
        const blueEl = document.getElementById("mainScoreBlue");

        if (lastScoreRed !== null && red !== lastScoreRed) {
            bumpScore(redEl);
        }
        if (lastScoreBlue !== null && blue !== lastScoreBlue) {
            bumpScore(blueEl);
        }

        redEl.textContent = red;
        blueEl.textContent = blue;

        redEl.classList.toggle("leading", red > blue);
        blueEl.classList.toggle("leading", blue > red);

        lastScoreRed = red;
        lastScoreBlue = blue;
    }

    function bumpScore(el) {
        el.classList.remove("bump");
        void el.offsetWidth;
        el.classList.add("bump");
        setTimeout(() => el.classList.remove("bump"), 500);
    }

    // ── PT REFEREE BOXES: 3 rows per referee (Pattern 1 / Pattern 2 / Total) ──
    const PT_REFEREE_COUNT = 5;

    function buildPtRefereeBoxes() {
        const labels = document.getElementById("refereeLabels");
        const rowP1 = document.getElementById("refereeBoxesP1");
        const rowP2 = document.getElementById("refereeBoxesP2");
        const rowTotal = document.getElementById("refereeBoxesTotal");

        const colStyle = `repeat(${PT_REFEREE_COUNT * 2}, 1fr)`;
        rowP1.style.gridTemplateColumns = colStyle;
        rowP2.style.gridTemplateColumns = colStyle;
        rowTotal.style.gridTemplateColumns = colStyle;
        labels.style.gridTemplateColumns = `repeat(${PT_REFEREE_COUNT}, 1fr)`;

        labels.innerHTML = "";
        rowP1.innerHTML = "";
        rowP2.innerHTML = "";
        rowTotal.innerHTML = "";

        for (let i = 1; i <= PT_REFEREE_COUNT; i++) {
            labels.insertAdjacentHTML("beforeend", `<span>REF. ${i}</span>`);
            rowP1.insertAdjacentHTML("beforeend", `
                <div class="referee-box" id="refP1_${i}blue">10</div>
                <div class="referee-box" id="refP1_${i}red">10</div>
            `);
            rowP2.insertAdjacentHTML("beforeend", `
                <div class="referee-box" id="refP2_${i}blue">10</div>
                <div class="referee-box" id="refP2_${i}red">10</div>
            `);
            rowTotal.insertAdjacentHTML("beforeend", `
                <div class="referee-box" id="refTotal_${i}blue">20</div>
                <div class="referee-box" id="refTotal_${i}red">20</div>
            `);
        }
    }

    // Applies a referees array (Pattern 1, Pattern 2, or the combined Total)
    // to the row matching the given box-id prefix. The boxes themselves
    // always stay visible, but while not yet revealed they're held at the
    // neutral start score with no color — real scores and coloring only
    // land once revealed, and only on the side each referee scored
    // *higher*, so the audience can read at a glance how many referees are
    // leaning red vs blue (a tie leaves both boxes neutral).
    const MAX_INTENSITY = 1.6; // fixed brightness/saturation boost for the winning box — no longer scaled by score margin

    function applyPtRefereeBoxes(referees, prefix, revealed, neutralScore = 10) {
        referees.forEach((ref, idx) => {
            const i = idx + 1;
            const redBox = document.getElementById(`${prefix}${i}red`);
            const blueBox = document.getElementById(`${prefix}${i}blue`);

            if (!revealed) {
                if (redBox) {
                    redBox.textContent = neutralScore;
                    redBox.classList.remove("red-active");
                    redBox.style.setProperty("--intensity", 1);
                }
                if (blueBox) {
                    blueBox.textContent = neutralScore;
                    blueBox.classList.remove("blue-active");
                    blueBox.style.setProperty("--intensity", 1);
                }
                return;
            }

            const isActive = !!ref?.active;
            const redScore = parseFloat(ref?.score?.red) || 0;
            const blueScore = parseFloat(ref?.score?.blue) || 0;

            const redWins = isActive && redScore > blueScore;
            const blueWins = isActive && blueScore > redScore;

            if (redBox) {
                redBox.textContent = redScore;
                redBox.classList.toggle("red-active", redWins);
                redBox.style.setProperty("--intensity", redWins ? MAX_INTENSITY : 1);
            }
            if (blueBox) {
                blueBox.textContent = blueScore;
                blueBox.classList.toggle("blue-active", blueWins);
                blueBox.style.setProperty("--intensity", blueWins ? MAX_INTENSITY : 1);
            }
        });
    }

    // ── PATTERN START ANNOUNCEMENT ──
    // Shows the pattern name huge on a dark overlay, then after 3s shrinks
    // and flies it into its real resting place (above the progress bar).
    let patternStartTimeout = null;

    // Blanks out the pattern name box and cancels any pending/in-flight
    // announcement — used after SHUFFLE-but-not-yet-STARTed, after advancing
    // pattern, or after RESET ALL, so no name is shown prematurely.
    function clearPatternNameDisplay() {
        clearTimeout(patternStartTimeout);

        const overlay = document.getElementById("patternStartOverlay");
        const textEl = document.getElementById("patternStartText");
        const targetEl = document.getElementById("patternNameDisplay");

        overlay.classList.remove("show");
        textEl.classList.remove("entering");
        targetEl.textContent = "";
    }

    function showPatternStartAnnouncement(name) {
        const overlay = document.getElementById("patternStartOverlay");
        const textEl = document.getElementById("patternStartText");
        const targetEl = document.getElementById("patternNameDisplay");

        clearTimeout(patternStartTimeout);

        textEl.textContent = name || "";
        targetEl.textContent = name || "";

        // Reset to the big centered state instantly (no transition) before animating in.
        textEl.style.transition = "none";
        textEl.style.top = "50%";
        textEl.style.left = "50%";
        textEl.style.fontSize = "19vh";
        textEl.style.transform = "translate(-50%, -50%) scale(1)";

        overlay.classList.add("show");
        textEl.classList.remove("entering");
        void textEl.offsetWidth; // force reflow so the pop-in restarts cleanly
        textEl.classList.add("entering");

        patternStartTimeout = setTimeout(() => {
            console.log("[pattern-anim] 5s timeout fired, calling flyTextToTarget");
            flyTextToTarget(textEl, targetEl, overlay);
        }, 5000);
    }

    function flyTextToTarget(textEl, targetEl, overlay) {
        console.log("[pattern-anim] flyTextToTarget called");
        overlay.classList.remove("show");

        const rect = targetEl.getBoundingClientRect();
        const targetFontSize = parseFloat(getComputedStyle(targetEl).fontSize);
        const startFontSize = parseFloat(getComputedStyle(textEl).fontSize);

        const startCenterX = window.innerWidth / 2;
        const startCenterY = window.innerHeight / 2;
        const endCenterX = rect.left + rect.width / 2;
        const endCenterY = rect.top + rect.height / 2;

        const deltaX = endCenterX - startCenterX;
        const deltaY = endCenterY - startCenterY;
        const scaleRatio = targetFontSize / startFontSize;

        console.log("[pattern-anim] delta:", deltaX, deltaY, "scaleRatio:", scaleRatio);

        // Keep top/left fixed at screen-center; animate purely via transform
        // (translate + scale), which is reliably GPU-accelerated and avoids
        // any layout-recalculation quirks that animating top/left/font-size
        // directly can run into.
        textEl.style.transition = "transform 1.2s cubic-bezier(0.65, 0, 0.35, 1)";
        textEl.style.transform =
            `translate(-50%, -50%) translate(${deltaX}px, ${deltaY}px) scale(${scaleRatio})`;

        setTimeout(() => {
            textEl.classList.remove("entering");
        }, 1250);
    }

    // ── APPLY INCOMING STATE (PT-specific fields on top of the shared ones) ──
    function applyState(payload) {
        // applyCommonFields would also try to color a single-row "referees"
        // grid that doesn't exist in PT's markup — harmless (those IDs don't
        // exist, so it's a no-op), but we handle referees ourselves below
        // using the 2-row layout instead.
        SharedDisplay.applyCommonFields(payload);

        if (payload.announcePatternStart) {
            showPatternStartAnnouncement(payload.announcePatternStart.name);
        }

        if (payload.clearPatternName) {
            clearPatternNameDisplay();
        }

        // Round label: shows BREAK, DOCTOR TIMER <COLOR>, or the normal R x/y
        const roundRowEl = document.getElementById("roundIndicatorRow");
        if (payload.activeDoctorColor) {
            roundRowEl.textContent = `DC.${payload.activeDoctorColor.toUpperCase()}`;
        } else if (payload.isBreakPhase) {
            roundRowEl.textContent = "BREAK";
        } else {
            if (payload.roundIndicator !== undefined || payload.roundTotal !== undefined) {
                roundRowEl.innerHTML = `R <span id="roundIndicator">${payload.roundIndicator ?? document.getElementById("roundIndicator")?.textContent ?? 1}</span>/<span id="roundTotal">${payload.roundTotal ?? document.getElementById("roundTotal")?.textContent ?? 1}</span>`;
            }
        }

        if (payload.isRunning !== undefined) {
            document.getElementById("playBarFill").classList.toggle("running", payload.isRunning);
        }

        if (payload.score) {
            applyMainScore(payload.score.red ?? 0, payload.score.blue ?? 0);
        }

        if (payload.patternReferees) {
            // Single-pattern categories don't need the Pattern 2 or Total
            // rows — Pattern 1 alone already is the final score.
            const totalPatterns = parseInt(payload.roundTotal ?? document.getElementById("roundTotal")?.textContent) || 1;
            const singlePattern = totalPatterns <= 1;
            document.getElementById("refereeBoxesP2").classList.toggle("hidden", singlePattern);
            document.getElementById("refereeBoxesTotal").classList.toggle("hidden", singlePattern);

            const revealed = payload.patternRevealed || {};
            const referees1 = payload.patternReferees[1] || [];
            const referees2 = payload.patternReferees[2] || [];
            applyPtRefereeBoxes(referees1, "refP1_", !!revealed[1]);
            applyPtRefereeBoxes(referees2, "refP2_", !!revealed[2]);

            // Total row: sum of Pattern 1 + Pattern 2 per referee, only
            // revealed once both patterns are — otherwise it'd leak a
            // partial total while Pattern 2 is still in progress.
            const bothRevealed = !!revealed[1] && !!revealed[2];
            const totals = referees1.map((ref1, idx) => {
                const ref2 = referees2[idx];
                return {
                    active: !!ref1?.active,
                    score: {
                        red: (parseFloat(ref1?.score?.red) || 0) + (parseFloat(ref2?.score?.red) || 0),
                        blue: (parseFloat(ref1?.score?.blue) || 0) + (parseFloat(ref2?.score?.blue) || 0)
                    }
                };
            });
            applyPtRefereeBoxes(totals, "refTotal_", bothRevealed, 20);
        }

        if (payload.tradSparringEnabled !== undefined) {
            document.getElementById("tradTimerDisplay").classList.toggle("hidden", !payload.tradSparringEnabled);
        }

        if (payload.tradTimerSeconds !== undefined) {
            const m = Math.floor(payload.tradTimerSeconds / 60).toString().padStart(2, "0");
            const s = Math.floor(payload.tradTimerSeconds % 60).toString().padStart(2, "0");
            document.getElementById("tradTimerDisplay").textContent = `${m}:${s}`;
        }
    }

    buildPtRefereeBoxes();

    SharedDisplay.configure({
        applyState: applyState
    });
    SharedDisplay.init();

    // ── DEMO MODE (?demo=1) ──
    // Scripted walkthrough of every PT display feature — the pattern-name
    // announcement fly-in, the progress bar, referee boxes revealing only
    // once a pattern finishes (colored to the winning side), the Total row
    // once both patterns are in, TRAD.SPARRING mode, and the winner overlay
    // — for recording a demo video without the real admin panel or
    // referees connected. Drives applyState() directly, then loops.
    if (new URLSearchParams(location.search).get("demo") === "1") {
        const neutralRef = { score: { red: 10, blue: 10 }, active: true };
        const DEMO_STEPS = [
            { at: 0, payload: {
                ring: 2, category: "SENIOR PATTERNS", matchNumber: 5,
                nameRed: "ANNA FERRARI", nameBlue: "PAOLO CONTI",
                countryRed: "ITALY", countryBlue: "ITALY",
                roundIndicator: 1, roundTotal: 2, isRunning: false,
                score: { red: 0, blue: 0 },
                patternReferees: { 1: Array(5).fill(neutralRef), 2: Array(5).fill(neutralRef) },
                patternRevealed: { 1: false, 2: false },
                tradSparringEnabled: false,
                nextMatches: [{ red: "ELISA MARINO", blue: "DAVIDE GRECO" }]
            } },
            { at: 1500, payload: { clearPatternName: true } },
            { at: 2500, payload: { announcePatternStart: { name: "CHOONG-JANG" } } },
            { at: 3500, payload: { isRunning: true } },
            { at: 9500, payload: { isRunning: false } },
            { at: 11000, payload: {
                // Main "score" is majority vote among the 5 referees (0-5,
                // never a raw point sum) — 2 favor red, 1 blue, 2 tie here.
                score: { red: 2, blue: 1 },
                patternReferees: { 1: [
                    { score: { red: 9.8, blue: 9.6 }, active: true },
                    { score: { red: 9.7, blue: 9.7 }, active: true },
                    { score: { red: 9.6, blue: 9.8 }, active: true },
                    { score: { red: 9.9, blue: 9.5 }, active: true },
                    { score: { red: 9.5, blue: 9.5 }, active: true }
                ], 2: Array(5).fill(neutralRef) },
                patternRevealed: { 1: true, 2: false }
            } },
            { at: 16000, payload: { roundIndicator: 2, clearPatternName: true } },
            { at: 17500, payload: { announcePatternStart: { name: "KORYO" } } },
            { at: 18500, payload: { isRunning: true } },
            { at: 24500, payload: { isRunning: false } },
            { at: 26000, payload: {
                // Combined (pattern1 + pattern2) majority: 3 referees now
                // favor red overall, 1 blue, 1 tie.
                score: { red: 3, blue: 1 },
                patternReferees: { 1: [
                    { score: { red: 9.8, blue: 9.6 }, active: true },
                    { score: { red: 9.7, blue: 9.7 }, active: true },
                    { score: { red: 9.6, blue: 9.8 }, active: true },
                    { score: { red: 9.9, blue: 9.5 }, active: true },
                    { score: { red: 9.5, blue: 9.5 }, active: true }
                ], 2: [
                    { score: { red: 9.6, blue: 9.7 }, active: true },
                    { score: { red: 9.8, blue: 9.4 }, active: true },
                    { score: { red: 9.5, blue: 9.6 }, active: true },
                    { score: { red: 9.7, blue: 9.5 }, active: true },
                    { score: { red: 9.6, blue: 9.6 }, active: true }
                ] },
                patternRevealed: { 1: true, 2: true }
            } },
            { at: 31000, payload: { tradSparringEnabled: true, tradTimerSeconds: 0 } },
            { at: 33000, payload: { tradTimerSeconds: 8 } },
            { at: 35000, payload: { tradTimerSeconds: 16 } },
            { at: 37000, payload: { tradTimerSeconds: 24 } },
            { at: 39000, payload: { tradSparringEnabled: false } },
            { at: 41000, payload: { announceWinner: { color: "red", name: "ANNA FERRARI", scoreRed: 3, scoreBlue: 1 } } }
        ];
        const LOOP_AFTER_MS = 49000;

        function runDemo() {
            DEMO_STEPS.forEach(step => setTimeout(() => applyState(step.payload), step.at));
            setTimeout(runDemo, LOOP_AFTER_MS);
        }

        setTimeout(runDemo, 500); // let the page finish laying out first
    }
</script>

</body>
</html>
