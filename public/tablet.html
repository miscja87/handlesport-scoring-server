<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Referee Scoring</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #1a1f2e;
            font-family: 'Arial', sans-serif;
            height: 100svh; /* smallest viewport height — avoids the last row
                                getting overlapped when the browser toolbar or
                                a system gesture bar reclaims space, which
                                100dvh doesn't reliably account for in
                                landscape on some Android browsers */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        .header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            padding: 6px 8px 0;
            flex-shrink: 0;
        }

        .score-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: clamp(20px, 5vw, 32px);
            font-weight: 900;
            color: white;
            letter-spacing: 1px;
            cursor: pointer;
            transition: filter 0.1s;
        }
        .score-bar:active { filter: brightness(1.2); }
        .score-bar.red  { background: #cc0000; }
        .score-bar.blue { background: #1a6fa8; }

        .undo-icon {
            font-size: clamp(14px, 3vw, 20px);
            opacity: 0.75;
            line-height: 1;
            pointer-events: none;
        }

        .header-info {
            text-align: center;
            color: #a0aab8;
            font-size: clamp(10px, 2vw, 13px);
            line-height: 1.5;
        }
        .header-info .state { font-weight: 700; font-size: clamp(11px, 2.2vw, 14px); }
        .header-info .state.stop    { color: #e53e3e; }
        .header-info .state.play { color: #38a169; }

        .score-grid {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            padding: 3px 0;
        }
        .score-grid.mode-3 { grid-template-rows: repeat(3, 1fr); }
        .score-grid.mode-1 { grid-template-rows: 1fr; }

        .score-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(28px, 7vw, 52px);
            font-weight: 300;
            color: rgba(255,255,255,0.9);
            border: none;
            cursor: pointer;
            transition: filter 0.1s, transform 0.1s;
            outline: none;
        }
        .score-btn.red  { background: #cc0000; }
        .score-btn.blue { background: #1a6fa8; }
        .score-btn:active { filter: brightness(1.2); transform: scale(0.98); }

        .score-grid.mode-1 .btn-3,
        .score-grid.mode-1 .btn-2 { display: none; }

        .score-grid.disabled .score-btn {
            opacity: 0.4;
            pointer-events: none;
        }

        .footer {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 3px;
            padding: 3px 0 0 0;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            flex-shrink: 0;
        }
        .footer-btn {
            background: #2a7a2a;
            border: none;
            color: white;
            padding: 14px 8px;
            font-size: clamp(14px, 3vw, 20px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter 0.1s;
            outline: none;
        }
        .footer-btn:active { filter: brightness(1.3); }
        .footer-btn.label {
            font-size: clamp(12px, 2.5vw, 16px);
            font-weight: 700;
            letter-spacing: 1px;
        }
        .footer-btn.menu-trigger {
            flex: 0 0 60px;
            width: 60px;
            background: #2a3550;
        }

        /* ── MENU ── */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 90;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .menu-sheet {
            background: #1f2638;
            width: 100%;
            border-radius: 16px 16px 0 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #2a3550;
            border: none;
            color: white;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
        }
        .menu-item:active { filter: brightness(1.2); }
        .menu-item .icon { font-size: 20px; width: 24px; text-align: center; }
        .menu-cancel {
            margin-top: 4px;
            background: #3a4560;
            color: #a0aab8;
            font-weight: 700;
            justify-content: center;
        }

        .loading {
            position: fixed;
            inset: 0;
            background: #1a1f2e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0aab8;
            font-size: 16px;
            z-index: 100;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 99;
        }
        .toast.show { opacity: 1; }
        .hidden { display: none !important; }

        /* ── OFFLINE OVERLAY — sits directly on top of the score grid
           (wrapped in .score-grid-wrap so it can be an absolutely
           positioned sibling, never a child the button-rendering code
           would wipe out) instead of a banner elsewhere on screen, so the
           "why can't I score" message appears exactly where the referee is
           looking. Purely visual — .score-grid.disabled already blocks the
           buttons underneath. */
        .score-grid-wrap {
            position: relative;
            flex: 1;
            min-height: 0;
        }
        .offline-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 13, 22, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            z-index: 10;
            pointer-events: none;
        }
        .offline-overlay .icon {
            font-size: clamp(32px, 8vw, 56px);
            color: #e05a5a;
        }
        .offline-overlay .title {
            font-size: clamp(16px, 4vw, 24px);
            font-weight: 900;
            letter-spacing: 1px;
            color: #e05a5a;
        }
        .offline-overlay .subtitle {
            font-size: clamp(11px, 2.5vw, 14px);
            color: #a0aab8;
        }

        /* ── CONNECTION ERROR MODAL ── */
        .error-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-modal {
            background: #1f2638;
            border-radius: 10px;
            width: 100%;
            max-width: 360px;
            overflow: hidden;
            border: 1px solid #5a2a30;
        }
        .error-modal-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 20px;
            border-bottom: 1px solid #2a3550;
        }
        .error-modal-header .error-icon { color: #e05a5a; font-size: 20px; }
        .error-modal-header h3 { color: #e05a5a; font-size: 16px; font-weight: 700; }
        .error-modal-body { padding: 20px; color: #c8ccd8; font-size: 14px; line-height: 1.5; }
        .error-modal-footer { padding: 0 20px 20px; }
        .error-modal-footer button {
            width: 100%;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            background: #cc3340;
        }
        .error-modal-footer button:active { filter: brightness(1.2); }
    </style>
</head>
<body>

    <div class="loading" id="loading">Connecting...</div>

    <div class="header hidden" id="mainHeader">
        <!-- slot-left and slot-right always hold the correct color bar -->
        <div class="score-bar red" id="slotLeft">
            <span id="scoreLeft">0</span>
            <span class="undo-icon">↺</span>
        </div>
        <div class="header-info">
            <div id="headerLabel">Ring 1, Referee 1</div>
            <div class="state stop" id="stateLabel">STOP</div>
        </div>
        <div class="score-bar blue" id="slotRight">
            <span id="scoreRight">0</span>
            <span class="undo-icon">↺</span>
        </div>
    </div>

    <div class="score-grid-wrap">
        <div class="score-grid mode-3 hidden disabled" id="scoreGrid">
            <!-- buttones generated by renderButtons() -->
        </div>
        <div class="offline-overlay hidden" id="offlineOverlay">
            <div class="icon">⚠</div>
            <div class="title">OFFLINE</div>
            <div class="subtitle">Scores won't be sent</div>
        </div>
    </div>

    <div class="footer hidden" id="footer">
        <button class="footer-btn menu-trigger" onclick="openMenu()" title="Menu">☰</button>
        <button class="footer-btn label" id="modeBtn" onclick="toggleMode()">1 B</button>
    </div>

    <div class="menu-overlay hidden" id="menuOverlay" onclick="closeMenuOnBackdrop(event)">
        <div class="menu-sheet">
            <button class="menu-item" onclick="reload(); closeMenu();">
                <span class="icon">↺</span> Reload scores
            </button>
            <button class="menu-item" onclick="swapColors(); closeMenu();">
                <span class="icon">⇄</span> Switch colors
            </button>
            <button class="menu-item" onclick="toggleFullscreen(); closeMenu();">
                <span class="icon">⛶</span> Fullscreen
            </button>
            <button class="menu-item menu-cancel" onclick="closeMenu()">Cancel</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- CONNECTION ERROR MODAL -->
    <div class="error-modal-overlay hidden" id="connErrorOverlay">
        <div class="error-modal">
            <div class="error-modal-header">
                <span class="error-icon">⚠</span>
                <h3>Connection problem</h3>
            </div>
            <div class="error-modal-body">
                The last 3 score updates failed to send. Please alert an official — some points may not have been recorded.
            </div>
            <div class="error-modal-footer">
                <button onclick="closeConnErrorModal()">OK</button>
            </div>
        </div>
    </div>

<script>
    const pathParts = window.location.pathname.split("/");
    const referee = parseInt(pathParts[pathParts.length - 1]);
    const token = new URLSearchParams(window.location.search).get("token");
    const serverBase = `http://${window.location.hostname}:${window.location.port}`;

    /* Score params */
    const ACTION_UPDATE_SCORE = "update_score";
    const ACTION_RESET_SCORE = "reset_score";
    const ACTION_UPDATE_STATE = "update_state";

    // "left" and "right" are the two visual sides — independent from red/blue
    // leftColor = color currently on the left side ("red" or "blue")
    let leftColor = "red";
    let scores = { red: 0, blue: 0 };
    let history = { red: [], blue: [] };
    let mode = 3;
    let state = "stop";
    let buttons = [3, 2, 1];
    let defaultButton = 1;

    // ── INIT ──
    async function init() {
        try {
            if (!token) throw new Error("Missing token");

            const res = await fetch(`${serverBase}/api/login/referee`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ refereeId: referee, token })
            });
            if (!res.ok) throw new Error("Login failed");
            const data = await res.json();

            scores.red  = parseFloat(data.score?.red)  || 0;
            scores.blue = parseFloat(data.score?.blue) || 0;
            buttons = data.configuration?.buttons ?? [3, 2, 1];
            defaultButton = data.configuration?.defaultButton ?? buttons[buttons.length - 1];
            const ring = data.configuration?.ring ?? 1;

            document.getElementById("headerLabel").textContent = `Ring ${ring}, Referee ${referee}`;

            renderButtons(buttons);
            bindButtons();
            updateDisplay();
            await fetchState();

            document.getElementById("loading").classList.add("hidden");
            document.getElementById("mainHeader").classList.remove("hidden");
            document.getElementById("scoreGrid").classList.remove("hidden");
            document.getElementById("footer").classList.remove("hidden");

            // Update mode-N based on buttons number
            const grid = document.getElementById("scoreGrid");
            grid.classList.remove("mode-1", "mode-3");
            grid.classList.add(buttons.length === 1 ? "mode-1" : "mode-3");

            const eventSource = new EventSource(`${serverBase}/stream/clients`);
            console.log("Event stream initialized on", `${serverBase}/stream/clients`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log("Event received:", data);

                if (data.referee === referee && data.action === ACTION_RESET_SCORE) {
                    scores.red  = parseFloat(data.score.red)  || 0;
                    scores.blue = parseFloat(data.score.blue) || 0;
                    history.red  = [];
                    history.blue = [];
                    updateDisplay();
                    showToast("Score updated from server");
                }

                if (data.action === ACTION_UPDATE_STATE) {
                    applyState(data.state);
                }
            };

        } catch (err) {
            document.getElementById("loading").textContent = `Error: ${err.message}`;
        }
    }

    // ── RENDER BUTTONS ──
    function renderButtons(btns) {
        const grid = document.getElementById("scoreGrid");
        grid.innerHTML = "";

        btns.forEach((val, i) => {
            const label = val > 0 ? `+ ${val}` : `${val}`;
            const idx = i + 1;

            const btnL = document.createElement("button");
            btnL.className = `score-btn red btn-${idx}`;
            btnL.id = `btnL${idx}`;
            btnL.textContent = label;
            grid.appendChild(btnL);

            const btnR = document.createElement("button");
            btnR.className = `score-btn blue btn-${idx}`;
            btnR.id = `btnR${idx}`;
            btnR.textContent = label;
            grid.appendChild(btnR);
        });

        // Update CSS grid rows based on buttons number
        grid.style.gridTemplateRows = `repeat(${btns.length}, 1fr)`;
    }

    // ── BIND BUTTONS ──
    function bindButtons() {
        const rightColor = leftColor === "red" ? "blue" : "red";

        document.getElementById("slotLeft").onclick  = () => undoScore(leftColor);
        document.getElementById("slotRight").onclick = () => undoScore(rightColor);

        buttons.forEach((val, i) => {
            const idx = i + 1;
            document.getElementById(`btnL${idx}`).onclick = () => addScore(leftColor,  val);
            document.getElementById(`btnR${idx}`).onclick = () => addScore(rightColor, val);
        });
    }

    // ── UPDATE DISPLAY ──
    function updateDisplay() {
        const rightColor = leftColor === "red" ? "blue" : "red";

        document.getElementById("scoreLeft").textContent  = scores[leftColor];
        document.getElementById("scoreRight").textContent = scores[rightColor];

        const slotLeft  = document.getElementById("slotLeft");
        const slotRight = document.getElementById("slotRight");
        slotLeft.className  = `score-bar ${leftColor}`;
        slotRight.className = `score-bar ${rightColor}`;

        buttons.forEach((val, i) => {
            const idx = i + 1;
            document.getElementById(`btnL${idx}`).className = `score-btn ${leftColor} btn-${idx}`;
            document.getElementById(`btnR${idx}`).className = `score-btn ${rightColor} btn-${idx}`;
        });
    }

    // ── FETCH STATE ──
    async function fetchState() {
        try {
            const res = await fetch(`${serverBase}/api/match/status`);
            if (!res.ok) throw new Error("Error");
            const data = await res.json();
            applyState(data.state);
        } catch (err) {
            console.error("Error in retrieving status:", err);
        }
    }

    function applyState(newState) {
        state = newState;
        const stateLabel = document.getElementById("stateLabel");
        if (state === "play") {
            stateLabel.textContent = "PLAY";
            stateLabel.className = "state play";
        } else {
            stateLabel.textContent = "STOP";
            stateLabel.className = "state stop";
        }
        updateScoreGridEnabled();
    }

    // Grid is enabled only while PLAY *and* online — offline taps would
    // never actually reach the server, so blocking them here avoids the
    // referee thinking they scored when nothing was sent.
    function updateScoreGridEnabled() {
        document.getElementById("scoreGrid").classList.toggle("disabled", state !== "play" || !navigator.onLine);
    }
    function swapColors() {
        leftColor = leftColor === "red" ? "blue" : "red";
        bindButtons();
        updateDisplay();
        sendScore();
    }

    // ── SCORE ──
    async function addScore(color, points) {
        if (state === "stop") {
            showToast("Scoring blocked — state STOP");
            return;
        }
        if (!navigator.onLine) {
            showToast("Scoring blocked — offline");
            return;
        }
        history[color].push(scores[color]);
        scores[color] = Math.max(0, parseFloat((scores[color] + points).toFixed(1)));
        updateDisplay();
        await sendScore();
    }

    async function undoScore(color) {
        if (state === "stop") {
            showToast("Scoring blocked — state STOP");
            return;
        }
        if (!navigator.onLine) {
            showToast("Scoring blocked — offline");
            return;
        }
        if (history[color].length === 0) {
            showToast("No actions to undo");
            return;
        }
        scores[color] = history[color].pop();
        updateDisplay();
        await sendScore();
    }

    async function reload() {
        
        location.reload();
    }

    async function sendScore() {
        let ok = false;
        try {
            // Not supported on iOS Safari (navigator.vibrate is undefined
            // there) — calling it unconditionally throws and skips the
            // fetch below entirely, which is why scores failed to send.
            if (navigator.vibrate) navigator.vibrate(100);
            const res = await fetch(`${serverBase}/api/score/referee/${referee}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    action: ACTION_UPDATE_SCORE,
                    score: { red: String(scores.red), blue: String(scores.blue) }
                })
            });
            ok = res.ok;
            if (!ok) showToast("Error sending score");
        } catch (err) {
            showToast("Error sending score");
        }

        // 3 sends in a row failing (network down, server unreachable, etc.)
        // is a real problem worth interrupting the referee for — a single
        // dropped send happens occasionally and self-corrects, so this only
        // fires on a genuine streak, not a one-off blip.
        if (ok) {
            consecutiveSendFailures = 0;
            connectionErrorShown = false;
        } else {
            consecutiveSendFailures++;
            if (consecutiveSendFailures >= 3 && !connectionErrorShown) {
                connectionErrorShown = true;
                showConnectionErrorModal();
            }
        }
    }

    // ── CONNECTION ERROR MODAL ──
    let consecutiveSendFailures = 0;
    let connectionErrorShown = false; // don't re-show on every failure during the same streak

    function showConnectionErrorModal() {
        document.getElementById("connErrorOverlay").classList.remove("hidden");
    }

    function closeConnErrorModal() {
        document.getElementById("connErrorOverlay").classList.add("hidden");
    }

    // ── MODE ──
    function toggleMode() {
        const grid = document.getElementById("scoreGrid");
        const btn  = document.getElementById("modeBtn");
        if (mode === buttons.length) {
            mode = 1;
            buttons.forEach((val, i) => {
                const idx = i + 1;
                const show = val === defaultButton;
                document.getElementById(`btnL${idx}`).style.display = show ? "" : "none";
                document.getElementById(`btnR${idx}`).style.display = show ? "" : "none";
            });
            grid.style.gridTemplateRows = "1fr";
            btn.textContent = `${buttons.length} B`;
        } else {
            mode = buttons.length;
            buttons.forEach((val, i) => {
                const idx = i + 1;
                document.getElementById(`btnL${idx}`).style.display = "";
                document.getElementById(`btnR${idx}`).style.display = "";
            });
            grid.style.gridTemplateRows = `repeat(${buttons.length}, 1fr)`;
            btn.textContent = "1 B";
        }
    }

    // ── MENU ──
    function openMenu() {
        document.getElementById("menuOverlay").classList.remove("hidden");
    }

    function closeMenu() {
        document.getElementById("menuOverlay").classList.add("hidden");
    }

    function closeMenuOnBackdrop(event) {
        if (event.target.id === "menuOverlay") closeMenu();
    }

    // ── UI HELPERS ──
    function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
    }

    // ── OFFLINE OVERLAY ──
    // navigator.onLine only means "there's a network interface up" — it
    // can't tell if the server is actually reachable (that's what the
    // 3-consecutive-failures modal in sendScore() is for). But it catches
    // the common case (wifi off, airplane mode) instantly, before the
    // referee even tries to score, instead of only finding out on failure.
    function updateOfflineOverlay() {
        document.getElementById("offlineOverlay").classList.toggle("hidden", navigator.onLine);
        updateScoreGridEnabled();
    }

    window.addEventListener("online", updateOfflineOverlay);
    window.addEventListener("offline", updateOfflineOverlay);
    updateOfflineOverlay();

    window.addEventListener("load", init);
</script>

</body>
</html>
